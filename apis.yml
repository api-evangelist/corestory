aid: corestory
name: CoreStory
description: >-
  CoreStory is an AI code intelligence platform that ingests large brownfield and legacy
  codebases and reverse-engineers a persistent understanding of how they work — generating
  product requirements (PRDs), technical specifications, dependency graphs, and business-rule
  extractions directly from source. That intelligence is served to architects, product
  managers, engineers, and AI coding agents (Claude, Cursor, Copilot, Devin) to accelerate
  modernization, migration, maintenance, and developer onboarding. CoreStory exposes a REST
  API (Bearer/JWT via Clerk) and a hosted Model Context Protocol (MCP) server so agents can
  query project PRDs, tech specs, and codebase conversations directly. San Francisco based;
  raised a $32M Series A in October 2025.
url: https://raw.githubusercontent.com/api-evangelist/corestory/refs/heads/main/apis.yml
