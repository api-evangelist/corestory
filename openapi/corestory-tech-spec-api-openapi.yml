components:
  schemas:
    TechSpecSingleSectionResponse:
      properties:
        prd_id:
          type: integer
          title: Prd Id
        created_at:
          type: string
          format: date-time
          title: Created At
        custom_prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Custom Prompt
        can_regenerate:
          type: boolean
          title: Can Regenerate
          default: false
        prd_version_num:
          anyOf:
          - type: integer
          - type: 'null'
          title: Prd Version Num
        prd_version_uid:
          anyOf:
          - type: string
          - type: 'null'
          title: Prd Version Uid
        stats:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Stats
          description: Optional stats such as total_user_stories and filtered_user_stories.
        language:
          anyOf:
          - $ref: '#/components/schemas/LanguageInfo'
          - type: 'null'
          description: Language the section was generated in, if non-English.
        system_architecture:
          anyOf:
          - additionalProperties: true
            type: object
          - type: string
          - type: 'null'
          title: System Architecture
        data_models:
          anyOf:
          - additionalProperties: true
            type: object
          - type: string
          - type: 'null'
          title: Data Models
        user_interface:
          anyOf:
          - additionalProperties: true
            type: object
          - type: string
          - type: 'null'
          title: User Interface
        api_specifications:
          anyOf:
          - additionalProperties: true
            type: object
          - type: string
          - type: 'null'
          title: Api Specifications
        interface_specifications:
          anyOf:
          - additionalProperties: true
            type: object
          - type: string
          - type: 'null'
          title: Interface Specifications
        integration_points:
          anyOf:
          - additionalProperties: true
            type: object
          - type: string
          - type: 'null'
          title: Integration Points
        security_considerations:
          anyOf:
          - additionalProperties: true
            type: object
          - type: string
          - type: 'null'
          title: Security Considerations
        implementation_strategy:
          anyOf:
          - additionalProperties: true
            type: object
          - type: string
          - type: 'null'
          title: Implementation Strategy
        tech_user_stories:
          anyOf:
          - items: {}
            type: array
          - type: string
          - type: 'null'
          title: Tech User Stories
        pagination:
          anyOf:
          - $ref: '#/components/schemas/PaginationMeta'
          - type: 'null'
        caveat:
          anyOf:
          - type: string
          - type: 'null'
          title: Caveat
          description: Provenance caveat for the requested section. Populated when the section's evidence is documentation-only or mixed; absent otherwise.
      type: object
      required:
      - prd_id
      - created_at
      title: TechSpecSingleSectionResponse
      description: 'Used for endpoint to get a single section of a tech spec.

        Only 1 section is ever output, endpoint sets "don''t output None".

        # AKA: Only output the property if it exists.'
    GenerateTechSpecCustomPromptItem:
      properties:
        section_name:
          $ref: '#/components/schemas/TechSpecStepsDashedEnum'
        prompt:
          type: string
          title: Prompt
        replacement:
          type: boolean
          title: Replacement
          default: false
      type: object
      required:
      - section_name
      - prompt
      title: GenerateTechSpecCustomPromptItem
    TechSpecStepsDashedEnum:
      type: string
      enum:
      - system-architecture
      - data-models
      - user-interface
      - api-specifications
      - interface-specifications
      - integration-points
      - security-considerations
      - tech-user-stories
      - implementation-strategy
      title: TechSpecStepsDashedEnum
      description: All tech spec steps with dashed values.
    UserStory:
      properties:
        epic_name:
          type: string
          title: Epic Name
          description: Name of the Epic that is grouping multiple user stories.
        title:
          type: string
          title: Title
          description: Title of the user story.
        description:
          type: string
          title: Description
          description: Description of the user story.
        business_rules:
          items:
            type: string
          type: array
          title: Business Rules
