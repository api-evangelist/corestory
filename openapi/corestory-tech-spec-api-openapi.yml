          anyOf:
          - $ref: '#/components/schemas/TechnicalSpecContext'
          - type: 'null'
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
      type: object
      title: GenerateTechSpecRequest
    Feature-Input:
      properties:
        name:
          type: string
          title: Name
          description: Name of the feature
        description:
          type: string
          title: Description
          description: Description of the feature
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
          description: Category of the feature
      type: object
      required:
      - name
      - description
