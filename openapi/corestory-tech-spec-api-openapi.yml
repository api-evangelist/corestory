          title: References
          description: Reference to the file where the user story was found.
        technical_requirements:
          anyOf:
          - $ref: '#/components/schemas/TechnicalRequirements'
          - type: 'null'
          description: Technical requirements for the user story.
        user_persona:
          anyOf:
          - type: string
          - type: 'null'
          title: User Persona
          description: User persona associated with the user story.
