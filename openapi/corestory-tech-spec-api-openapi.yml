      type: object
      required:
      - epic_name
      - title
      - description
      - business_rules
      - acceptance_criteria
      - references
      - user_persona
      title: UserStory
    JobStatusSummary:
      properties:
        status:
          type: string
          title: Status
          description: Current job status
        progress:
          type: number
          title: Progress
          description: Progress percentage (0-100)
          default: 0.0
        created_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Created By
          description: User ID who triggered this job
        failure_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Failure Type
          description: Short categorical failure tag set only when the job is FAILED. Lets the UI render category-specific guidance without parsing the message. See `app.orchestrations.ingestion.failure_handler.classify_failure` for the authoritative set of values.
        failure_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Failure Reason
          description: Human-readable failure message safe to show in the UI. Set only when the job is FAILED.
      type: object
      required:
      - status
      title: JobStatusSummary
      description: Lightweight status + progress for a single job type (ingestion, PRD generation, etc.).
    GenerateAllRequest:
      properties:
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
      type: object
      title: GenerateAllRequest
    TechnicalRequirements:
      properties:
        requirement:
          type: string
          title: Requirement
          description: Technical requirements for the user story.
        uml_diagram:
          anyOf:
          - type: string
          - type: 'null'
          title: Uml Diagram
          description: UML diagram for the user story.
          default: ''
        sequence_diagram:
          anyOf:
          - type: string
          - type: 'null'
          title: Sequence Diagram
          description: Sequence diagram for the user story.
          default: ''
        reference:
          items:
            $ref: '#/components/schemas/Reference'
          type: array
          title: Reference
          description: Reference to the file where the technical requirements were found.
      additionalProperties: false
      type: object
      required:
      - requirement
      - reference
      title: TechnicalRequirements
    ErrorBody:
      properties:
        message:
          type: string
          title: Message
        type:
          type: string
          title: Type
