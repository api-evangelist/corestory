openapi: 3.2.0
info:
  title: Crowdbotics API Documentation Sync Status API
  description: '# CoreStory API Overview


    The CoreStory API provides programmatic access to structured insights derived from software source code.'
  version: 1.26.2
servers:
- url: /
  description: Current server
security:
- BearerAuth: []
tags:
- name: Sync Status
paths:
  /api/organizations/projects/sync-status:
    get:
      tags:
      - Sync Status
      summary: List org projects with sync status
      description: Return a paginated list of projects in the org with their sync mode and status.
      operationId: list_project_sync_status
      parameters:
      - name: sync_mode
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/SyncMode'
          - type: 'null'
          description: Filter by sync mode
          title: Sync Mode
        description: Filter by sync mode
      - name: sort_by
        in: query
        required: false
        schema:
          enum:
          - name
          - last_ingested_at
          type: string
          description: Sort field
          default: name
          title: Sort By
        description: Sort field
      - name: sort_order
        in: query
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
          description: Sort direction
          default: asc
          title: Sort Order
        description: Sort direction
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-based)
          default: 1
          title: Page
        description: Page number (1-based)
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Items per page
          default: 50
          title: Size
        description: Items per page
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatusResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
components:
  schemas:
    ErrorSchema:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      type: object
      required:
      - error
      title: ErrorSchema
    SyncStatusItem:
      properties:
        project_id:
          type: integer
          title: Project Id
          description: Project ID
        name:
          type: string
          title: Name
          description: Project name
        sync_mode:
          $ref: '#/components/schemas/SyncMode'
          description: Manual or Auto
        status:
          $ref: '#/components/schemas/ProjectSyncStatus'
          description: Current sync/processing status
        last_ingested_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Ingested At
          description: Last successful ingestion timestamp
      type: object
      required:
      - project_id
      - name
      - sync_mode
      - status
      title: SyncStatusItem
      description: A single project row in the org project sync-status list.
    ProjectSyncStatus:
      type: string
      enum:
      - up_to_date
      - updating
      - stale
      - failed
      - couldnt_process
      title: ProjectSyncStatus
      description: Sync/processing status for a project in the org roster.
    SyncStatusResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/SyncStatusItem'
          type: array
          title: Items
          description: List of items
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
          description: Pagination metadata
        summary:
          $ref: '#/components/schemas/SyncStatusSummary'
          description: Org-wide aggregates (unaffected by filters)
      type: object
      required:
      - items
      - pagination
      - summary
      title: SyncStatusResponse
      description: Paginated project sync-status list with org-wide summary aggregates.
    ErrorBody:
      properties:
        message:
          type: string
          title: Message
        type:
          type: string
          title: Type
        details:
          additionalProperties: true
          type: object
          title: Details
          description: Optional extra context for the error.
      type: object
      required:
      - message
      - type
      title: ErrorBody
    PaginationMeta:
      properties:
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        size:
          type: integer
          title: Size
        pages:
          type: integer
          title: Pages
      type: object
      required:
      - total
      - page
      - size
      - pages
      title: PaginationMeta
    SyncMode:
      type: string
      enum:
      - manual
      - auto
      title: SyncMode
      description: Whether a project syncs manually or automatically with its repo.
    SyncStatusSummary:
      properties:
        total_count:
          type: integer
          title: Total Count
          description: Total projects across the organization ignoring filter
        auto_count:
          type: integer
          title: Auto Count
          description: Projects with sync_mode=auto across the org
        blocked_count:
          type: integer
          title: Blocked Count
          description: Projects with status=couldnt_process across the org
        is_ciu_exhausted:
          type: boolean
          title: Is Ciu Exhausted
          description: Whether the org has run out of CIUs
      type: object
      required:
      - total_count
      - auto_count
      - blocked_count
      - is_ciu_exhausted
      title: SyncStatusSummary
      description: Org-wide aggregates rendered as page-level chrome. Not affected by filters.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter the Bearer token from Clerk authentication
