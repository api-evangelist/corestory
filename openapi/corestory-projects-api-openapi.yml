        title:
          type: string
          title: Title
          description: PRD title
        version:
          type: integer
          title: Version
          description: PRD version number
        created_at:
          type: string
          format: date-time
          title: Created At
          description: When the PRD was created
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
          description: When the PRD was last updated
      type: object
      required:
      - id
      - project_id
      - title
      - version
      - created_at
      - updated_at
      title: PRDResponse
      description: Response model for PRD data
    Reference:
      properties:
        file_name:
          type: string
          title: File Name
          description: Name of the file where the reference was found (just the filename, e.g., 'COCRDLIC.cbl').
        line_number:
          anyOf:
          - type: integer
          - type: 'null'
          title: Line Number
          description: Line number where the reference was found in the code.
        reference_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Reference Text
          description: Textual content of the reference. Class, method name, or other relevant information.
        file_path:
          anyOf:
          - type: string
          - type: 'null'
          title: File Path
          description: 'Full relative path to the file from repository root (e.g., ''app/cbl/COCRDLIC.cbl''). Extract from the Source: lines in the context if available.'
      type: object
      required:
      - file_name
      title: Reference
    SyncModeResponse:
      properties:
