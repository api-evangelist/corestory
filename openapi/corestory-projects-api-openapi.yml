          $ref: '#/components/schemas/DocImpact'
      type: object
      title: DocImpactResponse
    SecurityFinding:
      properties:
        severity:
          type: string
          enum:
          - info
          - warning
          title: Severity
          description: Severity level badge
        title:
          type: string
          title: Title
          description: Short finding title
        description:
          type: string
          title: Description
          description: What was found and why it matters
        file_paths:
          items:
            type: string
          type: array
          title: File Paths
          description: Specific files where the issue was observed
      type: object
      required:
      - severity
      - title
      - description
      title: SecurityFinding
    ProjectCreateAndGenerateResponse:
      properties:
        id:
          type: integer
          title: Id
          description: Project ID
        name:
          type: string
          title: Name
          description: Project name
