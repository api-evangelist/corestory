      type: object
      required:
      - id
      - project_id
      - triggered_at
      - trigger_type
      - regenerated_docs
      title: IngestionEventResponse
    FileManifestItem:
      properties:
        path:
          type: string
          title: Path
          description: Full file path relative to the repository root
        file_name:
          type: string
          title: File Name
          description: Base file name derived from path
        status:
          type: string
          enum:
          - included
          - excluded
          title: Status
          description: Whether the file was included or excluded during pre-ingestion
        ingested:
          type: boolean
          title: Ingested
          description: Whether the file has been ingested into the vector store
        exclusion_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Exclusion Reason
          description: Reason for exclusion, null for included files
        creation_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Creation Date
          description: File creation date (ISO 8601)
        last_modified_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Modified Date
          description: Last modified date (ISO 8601)
        first_ingested_at:
          anyOf:
          - type: string
          - type: 'null'
          title: First Ingested At
          description: When the file was first ingested (ISO 8601)
        last_ingested_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Ingested At
          description: When the file was last ingested (ISO 8601)
      type: object
      required:
      - path
      - file_name
      - status
      - ingested
      title: FileManifestItem
