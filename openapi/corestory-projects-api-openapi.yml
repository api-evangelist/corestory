              schema:
                $ref: '#/components/schemas/SyncModeResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
components:
  schemas:
    TechSpecSingleSectionResponse:
      properties:
        prd_id:
          type: integer
          title: Prd Id
        created_at:
          type: string
          format: date-time
          title: Created At
        custom_prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Custom Prompt
        can_regenerate:
          type: boolean
          title: Can Regenerate
          default: false
        prd_version_num:
          anyOf:
          - type: integer
          - type: 'null'
          title: Prd Version Num
        prd_version_uid:
          anyOf:
          - type: string
          - type: 'null'
          title: Prd Version Uid
        stats:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Stats
          description: Optional stats such as total_user_stories and filtered_user_stories.
        language:
          anyOf:
          - $ref: '#/components/schemas/LanguageInfo'
          - type: 'null'
          description: Language the section was generated in, if non-English.
        system_architecture:
          anyOf:
          - additionalProperties: true
            type: object
          - type: string
          - type: 'null'
          title: System Architecture
        data_models:
          anyOf:
          - additionalProperties: true
            type: object
          - type: string
          - type: 'null'
          title: Data Models
        user_interface:
          anyOf:
          - additionalProperties: true
            type: object
          - type: string
          - type: 'null'
          title: User Interface
        api_specifications:
          anyOf:
          - additionalProperties: true
            type: object
          - type: string
          - type: 'null'
          title: Api Specifications
        interface_specifications:
          anyOf:
          - additionalProperties: true
            type: object
          - type: string
          - type: 'null'
          title: Interface Specifications
        integration_points:
          anyOf:
          - additionalProperties: true
            type: object
          - type: string
          - type: 'null'
          title: Integration Points
        security_considerations:
          anyOf:
          - additionalProperties: true
            type: object
          - type: string
          - type: 'null'
          title: Security Considerations
        implementation_strategy:
          anyOf:
          - additionalProperties: true
            type: object
          - type: string
          - type: 'null'
          title: Implementation Strategy
        tech_user_stories:
          anyOf:
          - items: {}
            type: array
          - type: string
          - type: 'null'
          title: Tech User Stories
        pagination:
          anyOf:
          - $ref: '#/components/schemas/PaginationMeta'
          - type: 'null'
        caveat:
          anyOf:
          - type: string
          - type: 'null'
          title: Caveat
          description: Provenance caveat for the requested section. Populated when the section's evidence is documentation-only or mixed; absent otherwise.
      type: object
      required:
      - prd_id
      - created_at
      title: TechSpecSingleSectionResponse
      description: 'Used for endpoint to get a single section of a tech spec.

        Only 1 section is ever output, endpoint sets "don''t output None".

        # AKA: Only output the property if it exists.'
    TechSpecStepsDashedEnum:
      type: string
      enum:
      - system-architecture
      - data-models
      - user-interface
      - api-specifications
      - interface-specifications
      - integration-points
      - security-considerations
      - tech-user-stories
      - implementation-strategy
      title: TechSpecStepsDashedEnum
      description: All tech spec steps with dashed values.
    GenerationStatusResponse:
      properties:
        prd:
          $ref: '#/components/schemas/JobStatusSummary'
        tech_spec:
          $ref: '#/components/schemas/JobStatusSummary'
        use_dga_pipeline:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Use Dga Pipeline
          description: Whether the DGA pipeline was used for this generation run
        react_status_summary:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: React Status Summary
          description: Final ReAct feature-extraction summary for this generation run
      type: object
      required:
      - prd
      - tech_spec
      title: GenerationStatusResponse
      description: PRD + tech-spec generation status.
