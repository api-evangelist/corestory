      type: string
      enum:
      - manual
      - auto
      title: SyncMode
      description: Whether a project syncs manually or automatically with its repo.
    GeneratePRDRequest:
      properties:
        custom_prompts:
          anyOf:
          - items:
              $ref: '#/components/schemas/GeneratePRDCustomPromptItem'
            type: array
          - type: 'null'
          title: Custom Prompts
