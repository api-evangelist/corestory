          enum:
          - test_coverage
          - error_handling
          - documentation
          - code_freshness
          - dependency_health
          - build_configuration
          title: Name
          description: Signal identifier (e.g. 'test_coverage')
        status:
          type: string
          enum:
          - green
          - yellow
          - red
          title: Status
          description: Traffic-light status for this indicator
        label:
          type: string
          title: Label
          description: Human-readable label (e.g. 'Test Coverage')
        summary:
          type: string
          title: Summary
          description: One-sentence explanation referencing evidence
        evidence:
          items:
            type: string
          type: array
          title: Evidence
          description: Specific evidence items
