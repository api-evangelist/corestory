  /api/projects/{project_id}/config:
    get:
      tags:
      - projects
      summary: Get project operator config (stored overrides + effective values)
      description: 'Return a project''s stored operator overrides and the resolved effective values.


        Internal-only: these overrides steer experiment/A-B behavior (e.g. chat

        topology) and are not org-member-facing.'
      operationId: get_project_config
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectConfigResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
    patch:
      tags:
      - projects
      summary: Update project operator config (partial merge)
      description: 'Partial-merge operator overrides onto a project''s config.


        Only keys present in the request change; a key set to null clears that

        override and falls back to the env default. Unknown keys are rejected.

        Internal-only.'
      operationId: update_project_config
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectConfig'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectConfigResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
