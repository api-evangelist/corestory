openapi: 3.2.0
info:
  title: Crowdbotics API Documentation Vector Store API
  description: '# CoreStory API Overview


    The CoreStory API provides programmatic access to structured insights derived from software source code.'
  version: 1.26.2
servers:
- url: /
  description: Current server
security:
- BearerAuth: []
tags:
- name: vector_store
paths:
  /api/vector-store/{project_id}/clear:
    post:
      tags:
      - vector_store
      summary: Clear the vector store
      operationId: clear_vector_store
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      responses:
        '200':
          description: Confirmation that the vector store was cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectorStoreResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '500':
          description: Internal server error
  /api/vector-store/{project_id}/latest-index:
    post:
      tags:
      - vector_store
      summary: Build the latest-filtered partial HNSW index for a project
      description: 'Schedule a per-project build of the partial HNSW index scoped to

        ``latest=''true''`` (COR-3016).


        The build runs ``CONCURRENTLY`` in the background — it can take minutes on

        large tables and we don''t want to block the request or hold a lock — so this

        returns ``202`` immediately. It''s idempotent (``IF NOT EXISTS``), so

        re-hitting the endpoint is safe.'
      operationId: build_latest_partial_index
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      responses:
        '202':
          description: Confirmation that the index build was scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectorStoreResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '500':
          description: Internal server error
  /api/vector-store/{project_id}/ingest:
    post:
      tags:
      - vector_store
      summary: Ingest data into the vector store
      description: Ingest data from a specified source into the vector store
      operationId: ingest_vector_data
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
            examples:
              Minimum:
                summary: Minimum required params
                value:
                  source_type: url
                  source: https://github.com/some/path/to/repo.git
              Full:
                summary: All parameters
                value:
                  source_type: git_clone
                  source: https://example.com/repo.git
                  num_questions: 2
                  num_summaries: 1
                  run_in_background: true
                  summary_types:
                  - self
                  force: false
              Custom summary and questions:
                summary: Custom summary and questions
                value:
                  source_type: default
                  force: true
                  num_summaries: 2
                  summary_types:
                  - self
                  - next
                  num_questions: 3
                  run_in_background: false
              Local directory with custom settings:
                summary: Local directory with custom settings
                value:
                  source_type: directory
                  source: /path/to/documents
                  force: true
                  num_summaries: 3
                  summary_types:
                  - self
                  - prev
                  - next
                  num_questions: 4
              Azure Blob Storage with custom settings:
                summary: Azure Blob Storage with custom settings
                value:
                  source_type: azure_blob
                  source: eastus/kenobi-test-app/blob-name.zip
                  force: true
                  num_summaries: 1
                  summary_types:
                  - self
                  num_questions: 2
              GitHub Repository using GitHub App:
                summary: GitHub Repository using GitHub App
                value:
                  source_type: repo_full_name
                  source: owner/repo-name
                  github_app_installation_id: 1234
                  force: true
                  num_summaries: 1
                  summary_types:
                  - self
                  num_questions: 2
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponseSchema'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '500':
          description: Internal server error
  /api/vector-store/{project_id}/status:
    get:
      tags:
      - vector_store
      summary: Get Vector Store Status
      description: Get the status of the vector store
      operationId: get_vector_store_status
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Vector Store Status
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '500':
          description: Internal server error
  /api/vector-store/{project_id}/side-load:
    post:
      tags:
      - vector_store
      summary: Side-load vectors directly into the database
      description: 'Insert vector records directly into the PostgreSQL vector store database.


        This endpoint allows you to:

        * Insert pre-computed vectors with text and metadata

        * Automatically compute embeddings for text if vectors are not provided

        * Batch process multiple records for efficiency

        * Specify custom document IDs or auto-generate UUIDs


        This is useful for:

        * Migrating data from other vector stores

        * Bulk loading pre-processed data

        * Testing with specific vector data

        * Integration with external embedding pipelines


        **Note**: This bypasses the normal document ingestion pipeline and directly

        inserts into the database. Use with caution in production environments.'
      operationId: side_load_vectors
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SideLoadRequest'
              description: "\n        Side-load request containing vector records to insert.\n\n        Example:\n        ```json\n        {\n            \"records\": [\n                {\n                    \"text\": \"This is sample text content\",\n                    \"vector\": [0.1, 0.2, 0.3, ...],  // Optional: 1536-dimensional vector\n                    \"metadata\": {\"source\": \"manual\", \"category\": \"test\"},\n                    \"document_id\": \"doc_001\"  // Optional: will generate UUID if not provided\n                },\n                {\n                    \"text\": \"Another piece of content\",\n                    \"metadata\": {\"source\": \"import\", \"priority\": \"high\"}\n                    // vector and document_id will be auto-generated\n                }\n            ],\n            \"batch_size\": 50\n        }\n        ```\n        "
      responses:
        '200':
          description: Status of the side-loading operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SideLoadResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '500':
          description: Internal server error
  /api/vector-store/{project_id}/add-documents:
    post:
      tags:
      - vector_store
      summary: Add documents to the vector store
      description: 'Adds new documents to the existing vector store.


        This endpoint allows uploading files that will be:

        * Processed and split into chunks

        * Embedded using the configured embedding model

        * Added to the existing vector store


        Supported file types: PDF, TXT, MD, HTML, JSON'
      operationId: add_vector_documents
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_add_vector_documents'
      responses:
        '200':
          description: Confirmation of successful document addition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddDocumentsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '500':
          description: Internal server error
  /api/vector-store/{project_id}/schema:
    get:
      tags:
      - vector_store
      summary: Get vector table schema information
      description: 'Inspect the structure of the vector store table to understand column names and types.


        This is useful for:

        * Understanding the exact table structure before side-loading

        * Debugging database issues

        * Verifying table creation

        * Understanding what columns are available for queries'
      operationId: get_vector_table_schema
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      responses:
        '200':
          description: Table schema information including column names and types
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Vector Table Schema
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '500':
          description: Internal server error
  /api/vector-store/{project_id}/export:
    get:
      tags:
      - vector_store
      summary: Export all vectors from the database
      description: 'Export all vector records from the PostgreSQL vector store for backup or migration purposes.


        This endpoint:

        * Retrieves all records from the vector table

        * Returns them in the same format used by the side-load endpoint

        * Supports pagination for large datasets

        * Includes full vector embeddings and metadata

        * Provides statistics about the export operation


        **Use cases:**

        * Backup vector data before system changes

        * Migrate data to another vector store

        * Analyze vector data externally

        * Create test datasets for development


        **Performance notes:**

        * Large datasets may take time to export

        * Consider using limit and offset for very large tables

        * Vector data can be substantial in size'
      operationId: export_vectors
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 10000
            minimum: 1
          - type: 'null'
          description: Maximum number of records to export. If not specified, exports all records.
          title: Limit
        description: Maximum number of records to export. If not specified, exports all records.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of records to skip (for pagination)
          default: 0
          title: Offset
        description: Number of records to skip (for pagination)
      - name: include_vectors
        in: query
        required: false
        schema:
          type: boolean
          description: Whether to include vector embeddings in the export (set to false to reduce size)
          default: true
          title: Include Vectors
        description: Whether to include vector embeddings in the export (set to false to reduce size)
      responses:
        '200':
          description: All vector records in side-load compatible format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportVectorsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '500':
          description: Internal server error
  /api/vector-store/{project_id}/export/stream:
    get:
      tags:
      - vector_store
      summary: Stream export all vectors as JSONL
      description: 'Stream export all vector records as newline-delimited JSON (JSONL) for memory-efficient processing of large datasets.


        This endpoint:

        * Streams records one at a time to minimize memory usage

        * Returns JSONL format (one JSON object per line)

        * Processes records in batches to avoid database timeouts

        * Suitable for very large vector stores

        * Can be imported directly using the side-load endpoint


        **Format:** Each line is a complete VectorRecord JSON object.

        **Use cases:**

        * Export very large vector databases without memory issues

        * Streaming backup for continuous processing

        * ETL pipelines that process data incrementally


        **Performance notes:**

        * Much more memory efficient than the regular export endpoint

        * Streams data as it''s retrieved from the database

        * Suitable for datasets of any size'
      operationId: export_vectors_stream
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      - name: batch_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 5000
          minimum: 100
          description: Number of records to fetch per database query batch
          default: 1000
          title: Batch Size
        description: Number of records to fetch per database query batch
      - name: include_vectors
        in: query
        required: false
        schema:
          type: boolean
          description: Whether to include vector embeddings in the export
          default: true
          title: Include Vectors
        description: Whether to include vector embeddings in the export
      responses:
        '200':
          description: Stream of JSONL records
          content:
            application/x-jsonlines: {}
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '500':
          description: Internal server error
  /api/vector-store/{project_id}/import/stream:
    post:
      tags:
      - vector_store
      summary: Import vectors from JSONL file
      description: 'Import vector records from a JSONL (JSON Lines) file, typically exported from the export/stream endpoint.


        This endpoint:

        * Processes JSONL files line by line for memory efficiency

        * Handles both records with pre-computed vectors and text-only records

        * Automatically computes embeddings for records without vectors

        * Processes data in configurable batches for performance

        * Skips metadata lines (non-record JSON objects)

        * Provides detailed import statistics and error reporting


        **Supported file format:**

        * JSONL (JSON Lines) - one JSON object per line

        * Each line should be a VectorRecord object or metadata

        * Compatible with files exported from the export/stream endpoint


        **Use cases:**

        * Restore data from backups

        * Migrate data between environments

        * Import data from external systems

        * Batch processing of vector data


        **Performance notes:**

        * Memory efficient streaming processing

        * Configurable batch sizes for database operations

        * Automatic error recovery for individual record failures'
      operationId: import_vectors_stream
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      - name: batch_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 10
          description: Number of records to process in each database batch
          default: 100
          title: Batch Size
        description: Number of records to process in each database batch
      - name: skip_existing
        in: query
        required: false
        schema:
          type: boolean
          description: Skip records that already exist (based on document_id/node_id)
          default: true
          title: Skip Existing
        description: Skip records that already exist (based on document_id/node_id)
      - name: compute_missing_embeddings
        in: query
        required: false
        schema:
          type: boolean
          description: Automatically compute embeddings for records without vectors
          default: true
          title: Compute Missing Embeddings
        description: Automatically compute embeddings for records without vectors
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_import_vectors_stream'
      responses:
        '200':
          description: Import statistics and operation results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportStreamResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '500':
          description: Internal server error
  /api/vector-store/{project_id}/cancel-ingest:
    post:
      tags:
      - vector_store
      summary: Cancel ongoing data ingestion
      description: Flip the active ingestion SOTJ job for the project to CANCELLED.
      operationId: cancel_vector_ingestion
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelIngestionResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '500':
          description: Internal server error
  /api/vector-store/{project_id}/update-metadata:
    post:
      tags:
      - vector_store
      summary: Update metadata for all records in the vector store
      description: 'Update metadata for all records in the vector store for a specific project.


        This endpoint:

        * Updates metadata for all existing records in the project''s vector store

        * Adds standard metadata fields like updated_at timestamp

        * Preserves existing metadata while adding new fields

        * Processes records in batches for performance


        **Use cases:**

        * Add tracking information to existing records

        * Update metadata after system changes

        * Standardize metadata across all records

        * Add project-specific metadata fields'
      operationId: update_vector_metadata
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      - name: action
        in: query
        required: false
        schema:
          enum:
          - file_relationships
          - update_metadata
          type: string
          default: file_relationships
          title: Action
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/FilesMetadataUpdate'
              - type: 'null'
              description: File paths to update metadata for
              title: File To Update
      responses:
        '200':
          description: Status of the metadata update operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMetadataResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '500':
          description: Internal server error
components:
  schemas:
    Body_import_vectors_stream:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          description: JSONL file containing vector records to import
      type: object
      required:
      - file
      title: Body_import_vectors_stream
    AddDocumentsResponse:
      properties:
        message:
          type: string
          title: Message
          description: Operation status message
        document_count:
          type: integer
          title: Document Count
          description: Number of documents added
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
          description: Additional operation metadata
      type: object
      required:
      - message
      - document_count
      title: AddDocumentsResponse
      description: Response model for adding documents to vector store
    ErrorSchema:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      type: object
      required:
      - error
      title: ErrorSchema
    SourceType:
      type: string
      enum:
      - git_clone
      - url
      - default
      - azure_blob
      - repo_full_name
      title: SourceType
      description: Enum-like class for source types.
    SideLoadRequest:
      properties:
        records:
          items:
            $ref: '#/components/schemas/VectorRecord'
          type: array
          title: Records
          description: List of vector records to insert into the database
        batch_size:
          type: integer
          maximum: 1000.0
          minimum: 1.0
          title: Batch Size
          description: 'Number of records to process in each batch (default: 100)'
          default: 100
      type: object
      required:
      - records
      title: SideLoadRequest
      description: Request model for side-loading vectors directly into the database
    IngestRequest:
      properties:
        source_type:
          $ref: '#/components/schemas/SourceType'
          description: 'Type of source to ingest from. Allowed: url, directory, git_clone, azure_blob (or default for legacy).'
        source:
          anyOf:
          - type: string
            maxLength: 2083
            minLength: 1
            format: uri
          - type: string
          - type: 'null'
          title: Source
          description: Source URL or directory path. If not provided, uses the configured default source.
        force:
          type: boolean
          title: Force
          description: Force re-ingestion of all documents, even if they already exist
          default: false
        num_summaries:
          type: integer
          maximum: 3.0
          minimum: 0.0
          title: Num Summaries
          description: 'Number of summaries to generate per document (default: 1, 0 to disable summaries)'
          default: 1
        summary_types:
          items:
            type: string
          type: array
          maxItems: 3
          title: Summary Types
          description: 'Types of summaries to generate (default: [''self'']). Options: [''self'', ''prev'', ''next'']. Ignored if num_summaries is 0.'
          default:
          - self
        num_questions:
          type: integer
          maximum: 5.0
          minimum: 0.0
          title: Num Questions
          description: 'Number of questions to generate per document (default: 2)'
          default: 2
        run_in_background:
          type: boolean
          title: Run In Background
          description: 'Run the ingestion process in the background (default: true). Set to false for synchronous processing.'
          default: true
        github_app_installation_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Github App Installation Id
          description: GitHub App installation ID for private repository access
      type: object
      required:
      - source_type
      title: IngestRequest
      description: "Request model for vector store ingestion.\n\nMINIMUM REQUIRED PARAMETERS EXAMPLE:\n{\n    \"source_type\": \"url\",\n    \"source\": \"https://github.com/some/path/to/repo.git\",\n}"
    VectorStoreResponse:
      properties:
        message:
          type: string
          title: Message
          description: Operation status message
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
          description: Additional operation metadata
      type: object
      required:
      - message
      title: VectorStoreResponse
      description: Response model for vector store operations
    VectorRecord:
      properties:
        text:
          type: string
          title: Text
          description: The text content to be stored
        vector:
          anyOf:
          - items:
              type: number
            type: array
          - type: 'null'
          title: Vector
          description: Pre-computed vector embedding. If not provided, will be computed from text using the configured embedding model
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
          description: Additional metadata to store with the vector
        document_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Id
          description: Document identifier. If not provided, a UUID will be generated
      type: object
      required:
      - text
      title: VectorRecord
      description: Model for a single vector record to be side-loaded
    UpdateMetadataResponse:
      properties:
        message:
          type: string
          title: Message
          description: Operation status message
        records_updated:
          type: integer
          title: Records Updated
          description: Number of records updated
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
          description: Additional operation metadata
      type: object
      required:
      - message
      - records_updated
      title: UpdateMetadataResponse
      description: Response model for updating metadata in vector store
    ExportVectorsResponse:
      properties:
        message:
          type: string
          title: Message
          description: Export operation status message
        total_records:
          type: integer
          title: Total Records
          description: Total number of records exported
        records:
          items:
            $ref: '#/components/schemas/VectorRecord'
          type: array
          title: Records
          description: List of exported vector records
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
          description: Additional export metadata including table info and export parameters
      type: object
      required:
      - message
      - total_records
      - records
      title: ExportVectorsResponse
      description: Response model for exporting vectors
    SideLoadResponse:
      properties:
        message:
          type: string
          title: Message
          description: Operation status message
        records_processed:
          type: integer
          title: Records Processed
          description: Number of records successfully processed
        records_failed:
          type: integer
          title: Records Failed
          description: Number of records that failed to process
        embeddings_computed:
          type: integer
          title: Embeddings Computed
          description: Number of embeddings that were computed (vs pre-provided)
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
          description: Additional operation metadata
      type: object
      required:
      - message
      - records_processed
      - records_failed
      - embeddings_computed
      title: SideLoadResponse
      description: Response model for side-loading vectors
    Body_add_vector_documents:
      properties:
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
          description: Documents to add to the vector store
      type: object
      required:
      - files
      title: Body_add_vector_documents
    ImportStreamResponse:
      properties:
        message:
          type: string
          title: Message
          description: Import operation status message
        total_lines_processed:
          type: integer
          title: Total Lines Processed
          description: Total number of lines processed from the JSONL file
        records_imported:
          type: integer
          title: Records Imported
          description: Number of vector records successfully imported
        records_failed:
          type: integer
          title: Records Failed
          description: Number of records that failed to import
        metadata_lines:
          type: integer
          title: Metadata Lines
          description: Number of metadata lines encountered (non-record lines)
        embeddings_computed:
          type: integer
          title: Embeddings Computed
          description: Number of embeddings computed for records without vectors
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
