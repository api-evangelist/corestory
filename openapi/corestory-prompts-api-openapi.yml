openapi: 3.2.0
info:
  title: Crowdbotics API Documentation Prompts API
  description: '# CoreStory API Overview


    The CoreStory API provides programmatic access to structured insights derived from software source code.'
  version: 1.26.2
servers:
- url: /
  description: Current server
security:
- BearerAuth: []
tags:
- name: Prompts
paths:
  /api/prompts/{project_id}/prd/{prd_id}:
    get:
      tags:
      - Prompts
      summary: Get custom prompts
      description: Retrieve all custom prompts for PRD, or a specific prompt if step is provided
      operationId: get_project_prompts
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      - name: prd_id
        in: path
        required: true
        schema:
          type: integer
          title: Prd Id
      - name: step
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AllPRDStepsEnum'
          - type: 'null'
          description: Optional step to filter by specific prompt
          title: Step
        description: Optional step to filter by specific prompt
      responses:
        '200':
          description: List of custom prompts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptListResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Prompt not found
        '500':
          description: Internal server error
  /api/prompts/{project_id}/prd/{prd_id}/{prompt_id}:
    get:
      tags:
      - Prompts
      summary: Get a custom prompt by ID
      description: Retrieve a specific custom prompt by its ID
      operationId: get_project_prompt
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      - name: prd_id
        in: path
        required: true
        schema:
          type: integer
          title: Prd Id
      - name: prompt_id
        in: path
        required: true
        schema:
          type: integer
          title: Prompt Id
      responses:
        '200':
          description: The requested custom prompt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Prompt not found
        '500':
          description: Internal server error
  /api/prompts/list:
    get:
      tags:
      - Prompts
      summary: Get all custom prompts across all PRDs
      description: Retrieve all custom prompts from all PRDs with pagination
      operationId: list_prompts
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Number of items per page
          default: 100
          title: Limit
        description: Number of items per page
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of items to skip
          default: 0
          title: Offset
        description: Number of items to skip
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search query for prompt content and step name
          title: Q
        description: Search query for prompt content and step name
      - name: prd_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by PRD ID
          title: Prd Id
        description: Filter by PRD ID
      responses:
        '200':
          description: Paginated list of all custom prompts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPromptListResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Prompt not found
        '500':
          description: Internal server error
  /api/prompts/{prompt_id}:
    get:
      tags:
      - Prompts
      summary: Get a custom prompt by ID
      description: Retrieve a specific custom prompt by its ID
      operationId: get_prompt
      parameters:
      - name: prompt_id
        in: path
        required: true
        schema:
          type: integer
          title: Prompt Id
      responses:
        '200':
          description: The requested custom prompt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Prompt not found
        '500':
          description: Internal server error
components:
  schemas:
    ErrorSchema:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      type: object
      required:
      - error
      title: ErrorSchema
    PromptResponse:
      properties:
        id:
          type: integer
          title: Id
          description: Unique identifier for the prompt
        step:
          type: string
          title: Step
          description: Name or identifier of the step (see AllPRDStepsEnum for valid values)
        prompt:
          type: string
          title: Prompt
          description: The custom prompt text
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
          description: When the prompt was created
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
          description: When the prompt was last updated
        prd_id:
          type: integer
          title: Prd Id
          description: ID of the PRD this prompt belongs to
          default: 1
        replacement:
          type: boolean
          title: Replacement
          description: Whether this prompt replaces the default prompt
          default: false
      type: object
      required:
      - id
      - step
      - prompt
      - created_at
      - updated_at
      title: PromptResponse
      description: Response model for a single prompt
      example:
        created_at: '2025-01-01T00:00:00'
        id: 1
        prd_id: 1
        prompt: Custom prompt text here
        replacement: false
        step: user_stories
        updated_at: '2025-01-01T00:00:00'
    PaginatedPromptListResponse:
      properties:
        results:
          items:
            $ref: '#/components/schemas/PromptResponse'
          type: array
          title: Results
        count:
          type: integer
          title: Count
        limit:
          type: integer
          title: Limit
        offset:
          type: integer
          title: Offset
      type: object
      required:
      - results
      - count
      - limit
      - offset
      title: PaginatedPromptListResponse
    ErrorBody:
      properties:
        message:
          type: string
          title: Message
        type:
          type: string
          title: Type
        details:
          additionalProperties: true
          type: object
          title: Details
          description: Optional extra context for the error.
      type: object
      required:
      - message
      - type
      title: ErrorBody
    AllPRDStepsEnum:
      type: string
      enum:
      - executive_overview
      - user_personas
      - high_level_requirements
      - user_stories
      - security_requirements
      - system_architecture
      - data_models
      - user_interface
      - api_specifications
      - interface_specifications
      - integration_points
      - security_considerations
      - tech_user_stories
      - implementation_strategy
      - retriever_api_specification
      - retriever_interface_specification
      - retriever_data_models
      - retriever_classes
      - retriever_summary
      title: AllPRDStepsEnum
    PromptListResponse:
      properties:
        prompts:
          items:
            $ref: '#/components/schemas/PromptResponse'
          type: array
          title: Prompts
          description: List of prompts
        available_steps:
          items:
            type: string
          type: array
          title: Available Steps
          description: List of available step values
      type: object
      required:
      - prompts
      title: PromptListResponse
      description: Response model for a list of prompts
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter the Bearer token from Clerk authentication
