openapi: 3.2.0
info:
  title: Crowdbotics API Documentation Webhooks API
  description: '# CoreStory API Overview


    The CoreStory API provides programmatic access to structured insights derived from software source code.'
  version: 1.26.2
servers:
- url: /
  description: Current server
security:
- BearerAuth: []
tags:
- name: Webhooks
paths:
  /api/webhooks/stripe:
    post:
      tags:
      - Webhooks
      summary: Stripe webhook
      description: Receives Stripe webhook events. Authenticated via Stripe signature verification.
      operationId: handle_stripe_webhook
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StripeWebhookResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
  /api/webhooks/subscriptions:
    post:
      tags:
      - Webhooks
      summary: Handle subscription state changes
      description: Webhook endpoint for external services to update subscription status
      operationId: handle_subscription_webhook
      parameters:
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionWebhookPayload'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSuccessResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
components:
  schemas:
    SubscriptionStatus:
      type: string
      enum:
      - active
      - suspended
      - canceled
      - failed
      title: SubscriptionStatus
      description: Subscription status enum.
    ErrorSchema:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      type: object
      required:
      - error
      title: ErrorSchema
    StripeWebhookResponse:
      properties:
        status:
          type: string
          title: Status
          default: ok
      type: object
      title: StripeWebhookResponse
      description: Response for Stripe webhook acknowledgement.
    WebhookSuccessResponse:
      properties:
        success:
          type: boolean
          title: Success
          description: Indicates whether the webhook was processed successfully
        organization_id:
          type: string
          title: Organization Id
          description: Clerk organization ID (if applicable)
        status:
          type: string
          title: Status
          description: New subscription status (if applicable)
      type: object
      required:
      - success
      - organization_id
      - status
      title: WebhookSuccessResponse
      description: Webhook success response.
    SubscriptionWebhookPayload:
      properties:
        organization_id:
          type: string
          title: Organization Id
          description: Clerk organization ID
          examples:
          - org_2abc123def456
        provider:
          $ref: '#/components/schemas/SubscriptionProvider'
          description: Subscription provider
        provider_subscription_id:
          type: string
          title: Provider Subscription Id
          description: Provider's subscription identifier
          examples:
          - sub_ms_xyz789
        plan_id:
          type: string
          title: Plan Id
          description: Plan identifier
          examples:
          - enterprise-monthly
          - professional-annual
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
          description: New subscription status
        action:
          $ref: '#/components/schemas/WebhookAction'
          description: Action that triggered the webhook
      type: object
      required:
      - organization_id
      - provider
      - provider_subscription_id
      - plan_id
      - status
      - action
      title: SubscriptionWebhookPayload
      description: "Webhook payload from Southworks subscription service.\n\nAttributes:\n    organization_id: Clerk organization ID\n    provider: Subscription provider\n    provider_subscription_id: Provider's subscription identifier\n    plan_id: Plan identifier (e.g., 'enterprise-monthly')\n    status: New subscription status\n    action: Action that triggered the webhook"
    SubscriptionProvider:
      type: string
      enum:
      - ms_marketplace
      - stripe
      title: SubscriptionProvider
      description: Subscription provider enum.
    WebhookAction:
      type: string
      enum:
      - activated
      - suspended
      - unsubscribed
      - reinstated
      - renewed
      - activated_failed
      - suspended_failed
      - unsubscribed_failed
      - reinstated_failed
      - renewed_failed
      title: WebhookAction
      description: Webhook action types.
    ErrorBody:
      properties:
        message:
          type: string
          title: Message
        type:
          type: string
          title: Type
        details:
          additionalProperties: true
          type: object
          title: Details
          description: Optional extra context for the error.
      type: object
      required:
      - message
      - type
      title: ErrorBody
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter the Bearer token from Clerk authentication
x-tagGroups:
- name: Ingest Your Codebase
  tags:
  - vector_store
  - projects
  - pre_ingestion
  - reingestion
- name: Generate Code Intelligence
  tags:
  - documents
  - document_generation
  - document_formatters
  - prd
  - prd_version
  - tech_spec
  - quality_metrics
  - sample_projects
- name: Query Your Codebase
  tags:
  - conversations
  - workflows
  - discovery
  - context
  - artifacts
- name: Manage and Inspect Intelligence
  tags:
  - api_debugging
  - events
  - version
  - files
  - cache
  - token_tracking
- name: Authenticate and Manage Access
  tags:
  - clerk_authentication
  - github_webhooks
  - github_integration
  - organizations
  - api_key_management
  - mcp_token_management
  - user
- name: (Advanced) Prompt Tuning
  tags:
  - prompts
- name: MCP Protocol
  tags:
  - mcp_protocol
- name: Administration
  tags:
  - admin
