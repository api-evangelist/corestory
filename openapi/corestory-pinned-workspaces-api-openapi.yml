openapi: 3.2.0
info:
  title: Crowdbotics API Documentation Pinned Workspaces API
  description: '# CoreStory API Overview


    The CoreStory API provides programmatic access to structured insights derived from software source code.'
  version: 1.26.2
servers:
- url: /
  description: Current server
security:
- BearerAuth: []
tags:
- name: pinned-workspaces
paths:
  /api/organizations/pinned-workspaces:
    get:
      tags:
      - pinned-workspaces
      summary: List the org's pinned workspaces
      description: Return pinned workspaces in pin order. Any org member may read; empty list if none.
      operationId: list_pinned_workspaces
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PinnedWorkspaceItem'
                type: array
                title: Response List Pinned Workspaces
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
    post:
      tags:
      - pinned-workspaces
      summary: Pin a workspace (admin only)
      description: 'Pin a workspace for the org. Admin only. Enforces the per-org pin cap.


        Returns the created pin with its derived sync status so the client can render

        it without a follow-up list call.'
      operationId: pin_workspace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinWorkspaceRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinnedWorkspaceItem'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
  /api/organizations/pinned-workspaces/{project_id}:
    delete:
      tags:
      - pinned-workspaces
      summary: Unpin a workspace (admin only)
      description: Remove a workspace pin. Admin only. 404 if the workspace wasn't pinned.
      operationId: unpin_workspace
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      responses:
        '204':
          description: Successful Response
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
components:
  schemas:
    ErrorSchema:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      type: object
      required:
      - error
      title: ErrorSchema
    PinnedWorkspaceItem:
      properties:
        project_id:
          type: integer
          title: Project Id
          description: Workspace (project) ID.
        name:
          type: string
          title: Name
          description: Workspace name.
        repo_slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Repo Slug
          description: Repository slug in 'owner/repo' form, if known.
        status:
          $ref: '#/components/schemas/ProjectSyncStatus'
          description: Current ingestion/sync status of the workspace.
        pinned_at:
          type: string
          format: date-time
          title: Pinned At
          description: When the workspace was pinned (drives pin order).
        is_stale:
          type: boolean
          title: Is Stale
          description: Whether the workspace intelligence is out of sync with the repo.
          default: false
        last_ingested_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Ingested At
          description: Timestamp of the last successful ingestion.
        ingestion_status:
          $ref: '#/components/schemas/JobStatus'
          description: Status of the workspace's latest ingestion job.
          default: not_started
      type: object
      required:
      - project_id
      - name
      - status
      - pinned_at
      title: PinnedWorkspaceItem
      description: A single pinned workspace, annotated with workspace metadata for display.
    PinWorkspaceRequest:
      properties:
        project_id:
          type: integer
          title: Project Id
          description: ID of the workspace (project) to pin.
      type: object
      required:
      - project_id
      title: PinWorkspaceRequest
      description: Body for pinning a workspace.
    ProjectSyncStatus:
      type: string
      enum:
      - up_to_date
      - updating
      - stale
      - failed
      - couldnt_process
      title: ProjectSyncStatus
      description: Sync/processing status for a project in the org roster.
    JobStatus:
      type: string
      enum:
      - not_started
      - running
      - completed
      - failed
      - cancelled
      title: JobStatus
      description: Job status enumeration
    ErrorBody:
      properties:
        message:
          type: string
          title: Message
        type:
          type: string
          title: Type
        details:
          additionalProperties: true
          type: object
          title: Details
          description: Optional extra context for the error.
      type: object
      required:
      - message
      - type
      title: ErrorBody
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter the Bearer token from Clerk authentication
