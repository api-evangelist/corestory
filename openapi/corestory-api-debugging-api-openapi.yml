openapi: 3.2.0
info:
  title: Crowdbotics API Documentation API Debugging API
  description: '# CoreStory API Overview


    The CoreStory API provides programmatic access to structured insights derived from software source code.'
  version: 1.26.2
servers:
- url: /
  description: Current server
security:
- BearerAuth: []
tags:
- name: api_debugging
paths:
  /:
    get:
      tags:
      - api_debugging
      summary: Root
      description: 'Root endpoint that provides basic API information.


        Returns:

        dict: Welcome message and API version'
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health:
    get:
      tags:
      - api_debugging
      summary: Health Check
      description: 'Health check endpoint to verify API status.


        Returns:

        dict: Health status of the API'
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter the Bearer token from Clerk authentication
