openapi: 3.2.0
info:
  title: Crowdbotics API Documentation Context API
  description: '# CoreStory API Overview


    The CoreStory API provides programmatic access to structured insights derived from software source code.'
  version: 1.26.2
servers:
- url: /
  description: Current server
security:
- BearerAuth: []
tags:
- name: Context
paths:
  /api/projects/{project_id}/prd/context:
    get:
      tags:
      - Context
      summary: Get the context for the project's latest PRD
      description: 'Get the context for the project''s latest PRD.


        Args:

        project_id: ID of the Project


        Returns:

        PRDContextResponse: The PRD context with creation timestamp'
      operationId: get_prd_context
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      responses:
        '200':
          description: The PRD context with creation timestamp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PRDContextResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
    post:
      tags:
      - Context
      summary: Set or update the context for the project's latest PRD
      description: 'Set or update the context for a specific PRD.


        Args:

        project_id: ID of the Project


        Returns:

        PRDContextResponse: The updated PRD context with creation timestamp'
      operationId: set_prd_context
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PRDContextRequest'
      responses:
        '200':
          description: The updated PRD context with creation timestamp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PRDContextResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
components:
  schemas:
    ErrorBody:
      properties:
        message:
          type: string
          title: Message
        type:
          type: string
          title: Type
        details:
          additionalProperties: true
          type: object
          title: Details
          description: Optional extra context for the error.
      type: object
      required:
      - message
      - type
      title: ErrorBody
    ErrorSchema:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      type: object
      required:
      - error
      title: ErrorSchema
    PRDContextRequest:
      properties:
        context:
          type: string
          title: Context
          description: The context to set for the PRD
          example: This is the context for the PRD that will be used for document generation.
      type: object
      required:
      - context
      title: PRDContextRequest
      description: Request model for setting PRD context.
    PRDContextResponse:
      properties:
        context:
          type: string
          title: Context
          description: The PRD context
        created_at:
          type: string
          format: date-time
          title: Created At
          description: When the context was created
      type: object
      required:
      - context
      - created_at
      title: PRDContextResponse
      description: Response model for PRD context.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter the Bearer token from Clerk authentication
