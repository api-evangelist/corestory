openapi: 3.2.0
info:
  title: Crowdbotics API Documentation MCP Token Management API
  description: '# CoreStory API Overview


    The CoreStory API provides programmatic access to structured insights derived from software source code.'
  version: 1.26.2
servers:
- url: /
  description: Current server
security:
- BearerAuth: []
tags:
- name: mcp_token_management
paths:
  /api/mcp-tokens:
    post:
      tags:
      - mcp_token_management
      summary: Create a new MCP token
      description: 'Create a new named MCP access token.


        The token is returned ONLY ONCE in the response. Save it securely!


        Use this token to authenticate MCP clients like Claude Desktop.'
      operationId: create_mcp_token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPTokenCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPTokenCreateResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
    get:
      tags:
      - mcp_token_management
      summary: List all MCP tokens
      description: List all MCP tokens for the current user.
      operationId: list_mcp_tokens
      parameters:
      - name: include_revoked
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Revoked
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPTokenListResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
  /api/mcp-tokens/{token_id}:
    get:
      tags:
      - mcp_token_management
      summary: Get token details
      description: Get details for a specific MCP token.
      operationId: get_mcp_token
      parameters:
      - name: token_id
        in: path
        required: true
        schema:
          type: string
          title: Token Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPTokenResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
    patch:
      tags:
      - mcp_token_management
      summary: Update token metadata
      description: Update the name or description of an MCP token.
      operationId: update_mcp_token
      parameters:
      - name: token_id
        in: path
        required: true
        schema:
          type: string
          title: Token Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPTokenUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPTokenResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
    delete:
      tags:
      - mcp_token_management
      summary: Revoke a token
      description: Revoke an MCP token. The token will immediately stop working.
      operationId: delete_mcp_token
      parameters:
      - name: token_id
        in: path
        required: true
        schema:
          type: string
          title: Token Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPTokenRevokeResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
  /api/mcp-tokens/{token_id}/revoke:
    post:
      tags:
      - mcp_token_management
      summary: Revoke a token (alternative endpoint)
      description: Alternative endpoint to revoke a token. Same as DELETE /mcp-tokens/{token_id}
      operationId: revoke_mcp_token
      parameters:
      - name: token_id
        in: path
        required: true
        schema:
          type: string
          title: Token Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPTokenRevokeResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
components:
  schemas:
    MCPTokenResponse:
      properties:
        id:
          type: string
          title: Id
          description: Token identifier
        name:
          type: string
          title: Name
          description: Token name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Token description
        token_prefix:
          type: string
          title: Token Prefix
          description: Display-safe token prefix (mcp_abc...xyz)
        created_at:
          type: string
          format: date-time
          title: Created At
          description: When the token was created
        expires_at:
          type: string
          format: date-time
          title: Expires At
          description: When the token expires
        last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Used At
          description: Last time token was used
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Revoked At
          description: When token was revoked (if revoked)
        revoked_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Revoked By
          description: User who revoked the token
        is_active:
          type: boolean
          title: Is Active
          description: Whether token is active (not revoked/expired)
        is_revoked:
          type: boolean
          title: Is Revoked
          description: Whether token is revoked
        is_expired:
          type: boolean
          title: Is Expired
          description: Whether token is expired
      type: object
      required:
      - id
      - name
      - token_prefix
      - created_at
      - expires_at
      - is_active
      - is_revoked
      - is_expired
      title: MCPTokenResponse
      description: Response for token metadata (without sensitive data).
    ErrorSchema:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      type: object
      required:
      - error
      title: ErrorSchema
    MCPTokenRevokeResponse:
      properties:
        id:
          type: string
          title: Id
          description: Token identifier
        name:
          type: string
          title: Name
          description: Token name
        revoked_at:
          type: string
          format: date-time
          title: Revoked At
          description: When token was revoked
        revoked_by:
          type: string
          title: Revoked By
          description: User who revoked the token
        message:
          type: string
          title: Message
          description: Success message
          default: Token successfully revoked
      type: object
      required:
      - id
      - name
      - revoked_at
      - revoked_by
      title: MCPTokenRevokeResponse
      description: Response after revoking a token.
    MCPTokenUpdateRequest:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Name
          description: New token name
        description:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Description
          description: New token description
      type: object
      title: MCPTokenUpdateRequest
      description: Request to update token metadata.
    MCPTokenListResponse:
      properties:
        tokens:
          items:
            $ref: '#/components/schemas/MCPTokenResponse'
          type: array
          title: Tokens
          description: List of tokens
        total_count:
          type: integer
          title: Total Count
          description: Total number of tokens
        active_count:
          type: integer
          title: Active Count
          description: Number of active tokens
        revoked_count:
          type: integer
          title: Revoked Count
          description: Number of revoked tokens
      type: object
      required:
      - tokens
      - total_count
      - active_count
      - revoked_count
      title: MCPTokenListResponse
      description: Response for listing tokens.
    MCPTokenCreateRequest:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
          description: User-friendly token name (e.g., 'Claude Desktop - MacBook Pro')
          examples:
          - Claude Desktop - MacBook Pro
          - CI/CD Pipeline
          - Development Server
        description:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Description
          description: Optional description for the token
          examples:
          - Personal development machine
          - Production deployment token
        expires_days:
          type: integer
          maximum: 730.0
          minimum: 1.0
          title: Expires Days
          description: Token validity in days (1-730 days)
          default: 365
          examples:
          - 30
          - 90
          - 365
      type: object
      required:
      - name
      title: MCPTokenCreateRequest
      description: Request to create a new MCP token.
    MCPTokenCreateResponse:
      properties:
        id:
          type: string
          title: Id
          description: Token identifier
        name:
          type: string
          title: Name
          description: Token name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Token description
        token_prefix:
          type: string
          title: Token Prefix
          description: Display-safe token prefix (mcp_abc...xyz)
        created_at:
          type: string
          format: date-time
          title: Created At
          description: When the token was created
        expires_at:
          type: string
          format: date-time
          title: Expires At
          description: When the token expires
        last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Used At
          description: Last time token was used
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Revoked At
          description: When token was revoked (if revoked)
        revoked_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Revoked By
          description: User who revoked the token
        is_active:
          type: boolean
          title: Is Active
          description: Whether token is active (not revoked/expired)
        is_revoked:
          type: boolean
          title: Is Revoked
          description: Whether token is revoked
        is_expired:
          type: boolean
          title: Is Expired
          description: Whether token is expired
        token:
          type: string
          title: Token
          description: Full token string (shown only once!)
        warning:
          type: string
          title: Warning
          description: Security warning
          default: Save this token securely. You won't be able to see it again.
      type: object
      required:
      - id
      - name
      - token_prefix
      - created_at
      - expires_at
      - is_active
      - is_revoked
      - is_expired
      - token
      title: MCPTokenCreateResponse
      description: Response when creating a new token (includes full token ONCE).
    ErrorBody:
      properties:
        message:
          type: string
          title: Message
        type:
          type: string
          title: Type
        details:
          additionalProperties: true
          type: object
          title: Details
          description: Optional extra context for the error.
      type: object
      required:
      - message
      - type
      title: ErrorBody
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter the Bearer token from Clerk authentication
