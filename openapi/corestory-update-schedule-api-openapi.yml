openapi: 3.2.0
info:
  title: Crowdbotics API Documentation Update Schedule API
  description: '# CoreStory API Overview


    The CoreStory API provides programmatic access to structured insights derived from software source code.'
  version: 1.26.2
servers:
- url: /
  description: Current server
security:
- BearerAuth: []
tags:
- name: Update Schedule
paths:
  /api/organizations/schedule:
    get:
      tags:
      - Update Schedule
      summary: Get the org update schedule
      description: Return the org update schedule, or null if none exists.
      operationId: get_update_schedule
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/UpdateScheduleResponse'
                - type: 'null'
                title: Response Get Update Schedule
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
    put:
      tags:
      - Update Schedule
      summary: Create or update the org update schedule
      description: Create or update the org update schedule. Blocked while a run is in progress.
      operationId: upsert_update_schedule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduleUpsert'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateScheduleResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
components:
  schemas:
    ErrorSchema:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      type: object
      required:
      - error
      title: ErrorSchema
    UpdateScheduleResponse:
      properties:
        id:
          type: string
          title: Id
        organization_id:
          type: string
          title: Organization Id
        cadence:
          $ref: '#/components/schemas/ScheduleCadence'
        day_of_week:
          anyOf:
          - type: integer
          - type: 'null'
          title: Day Of Week
        day_of_month:
          anyOf:
          - type: integer
          - type: 'null'
          title: Day Of Month
        time:
          type: string
          title: Time
        doc_sync:
          type: boolean
          title: Doc Sync
        last_edited_by_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Edited By Id
        last_edited_by_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Edited By Name
        last_edited_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Edited At
        timezone:
          type: string
          title: Timezone
          default: UTC
        next_run_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Next Run At
        is_running:
          type: boolean
          title: Is Running
          default: false
        auto_codebases_count:
          type: integer
          title: Auto Codebases Count
          default: 0
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - organization_id
      - cadence
      - time
      - doc_sync
      - created_at
      - updated_at
      title: UpdateScheduleResponse
      description: Response for org update schedule, includes computed fields.
    ScheduleCadence:
      type: string
      enum:
      - daily
      - weekly
      - monthly
      title: ScheduleCadence
      description: How frequently the org schedule runs.
    UpdateScheduleUpsert:
      properties:
        cadence:
          $ref: '#/components/schemas/ScheduleCadence'
        day_of_week:
          anyOf:
          - type: integer
            maximum: 6.0
            minimum: 0.0
          - type: 'null'
          title: Day Of Week
          description: 0=Monday..6=Sunday. Required when weekly.
        day_of_month:
          anyOf:
          - type: integer
            maximum: 28.0
            minimum: 1.0
          - type: 'null'
          title: Day Of Month
          description: 1-28. Required when monthly.
        time:
          type: string
          pattern: ^([01]\d|2[0-3]):(00|30)$
          title: Time
          description: HH:MM in 24h format. Must be on a 30-minute boundary (e.g. 09:00, 09:30).
        doc_sync:
          type: boolean
          title: Doc Sync
          default: true
      type: object
      required:
      - cadence
      - time
      title: UpdateScheduleUpsert
      description: Create or update an org update schedule. Single atomic operation.
    ErrorBody:
      properties:
        message:
          type: string
          title: Message
        type:
          type: string
          title: Type
        details:
          additionalProperties: true
          type: object
          title: Details
          description: Optional extra context for the error.
      type: object
      required:
      - message
      - type
      title: ErrorBody
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter the Bearer token from Clerk authentication
