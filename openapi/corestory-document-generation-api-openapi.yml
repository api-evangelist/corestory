openapi: 3.1.0
info:
  title: Crowdbotics API Documentation admin document_generation API
  description: "# CoreStory API Overview\n\nThe CoreStory API provides programmatic access to structured insights derived from software source code. It is designed for engineering, architecture, and product teams who need to extract business logic, technical specifications, architectural relationships, and system-level context from complex or legacy codebases.\n\nBy interfacing directly with CoreStory API, users can:\n\n- Generate full Product Requirements Documents (PRDs) from a codebase\n- Extract detailed Technical Specifications for modernization or migration\n- Query a codebase using natural language to surface implementation details, logic paths, dependencies, and architectural insights\n- Construct and visualize knowledge graphs of systems, components, and relationships\n- Ingest, store, and retrieve content from a vector store for AI-powered retrieval-augmented generation (RAG) workflows\n\nCoreStory is especially valuable in contexts where:\n\n- Codebases are large, unstructured, or under-documented\n- Product and engineering teams are onboarding to unfamiliar systems\n- Technical stakeholders require visibility into system design or feature coverage\n- Modernization, replatforming, or M&A due diligence is underway\n\nThe API can be integrated into existing CI/CD pipelines, internal developer portals, architecture review boards, product planning processes, or documentation automation workflows.\n\nAll endpoints support secure authentication and are designed for high-availability, asynchronous workloads. Output formats include JSON, Markdown, and PDF, with flexible formatting options for downstream consumption.\n\nFor step-by-step usage instructions and workflows, refer to the [CoreStory API Quick Start Guide](#section/CoreStory-API-Quick-Start-Guide).\n\n## Features\n\n* **Document Generation**\n    * Generate complete Product Requirements Documents (PRD)\n    * Generate Technical Specifications\n    * Generate individual document sections (executive overview, user personas, etc.)\n    * Format documents in JSON or Markdown\n\n* **Vector Store Management**\n    * Ingest and manage documents in vector store\n    * Query and retrieve document content\n    * Manage document embeddings\n\n* **Context Management**\n    * Manage context for different document types\n    * Set and retrieve PRD context\n    * Support for future context types (technical specs, user stories, etc.)\n\n* **Knowledge Graph**\n    * Generate knowledge graphs from codebase queries\n    * Visualize relationships between code entities\n    * Analyze code structure and dependencies\n\n* **API Endpoints**\n    * `/api/documents/*` - Document generation and formatting\n    * `/api/generate/*` - Document formatting utilities\n    * `/api/vector-store/*` - Vector store management\n    * `/api/agents/*` - AI agent operations\n    * `/api/context/*` - Context management for documents\n    * `/api/graph/*` - Knowledge graph generation and analysis\n\nNote: JWT authentication support coming soon. All endpoints currently provide detailed OpenAPI documentation.\n\n* **Observability**\n    * OpenTelemetry instrumentation for distributed tracing\n    * Prometheus metrics endpoint at `/metrics`\n    * Comprehensive request/response tracking\n    * Custom business metrics\n\n\n\n# CoreStory System Architecture\n\nThis document provides a high-level overview of how the CoreStory platform ingests, analyzes, and serves structured software intelligence through its API. The system is designed to process codebases and related technical artifacts in order to generate product specifications, technical documents, and knowledge graph representations.\n\n---\n\n## Core Components\n\n### 1. **Ingestion Layer**\n\n- Accepts Git URLs, file uploads, or local archives\n- Extracts source files, documentation, and metadata\n- Initiates chunking and embedding via the vector store pipeline\n\n### 2. **Vector Store and Context Engine**\n\n- Stores chunked and embedded documents\n- Supports semantic search and document retrieval\n- Feeds LLMs with scoped context for generation and reasoning\n\n### 3. **LLM Orchestration Layer**\n\n- Fan-out to multiple large language models\n- Handles prompt templating, context injection, and result normalization\n- Evaluates and scores generated outputs\n\n### 4. **Document Generation Engine**\n\n- Produces:\n  - PRDs\n  - Technical Specs\n  - Individual document sections\n  - Markdown and PDF exports\n- Format-flexible output for portals, APIs, and documentation pipelines\n\n### 5. **Graph Construction Module**\n\n- Extracts static and dynamic code relationships\n- Builds DAGs and call graphs of components, services, and files\n- Allows natural-language queries that return graph subviews and LLM explanations\n\n### 6. **Query Engine**\n\n- Accepts free-form questions about codebases\n- Routes queries to code graph, document store, or LLMs\n- Returns structured JSON answers and explanatory text\n\n### 7. **API Gateway**\n\n- Authenticates and rate-limits clients\n- Routes requests to internal services\n- Serves all external-facing endpoints in REST format\n\n---\n\n## Security and Privacy\n\n- All data transfer is encrypted via HTTPS\n- API access is secured using provided auth credentials (JWT tokens coming soon)\n- Uploaded code is only used to generate customer-requested outputs and is not retained indefinitely\n\n---\n\n## Extensibility\n\nThe platform is modular. It can be extended to:\n\n- Add new LLMs for ensemble generation\n- Integrate alternative vector databases\n- Connect to internal developer portals or product management tools via webhook or export endpoints\n\nFor more information, see the Quick Start or contact the CoreStory team.\n\n\n# CoreStory API Quick Start Guide\n\nThe CoreStory API provides programmatic access to structured code intelligence, enabling your team to extract business and technical specifications directly from source code. You can use the API to integrate CoreStory-generated documents into existing workflows, support software modernization and maintenance efforts, or enrich internal platforms with architectural and feature-level metadata.\n\n---\n\n## Overview\n\nThe CoreStory API enables:\n\n- Ingestion of content into a **vector store** for LLM-driven analysis\n- Generation of **Product Requirements Documents (PRDs)** and **Technical Specifications** from code\n- Interrogation of your codebase via a natural language **query engine**\n- Construction of **knowledge graphs** describing code relationships and system architecture\n- Management of **custom document context** and **custom prompts** for improved output relevance and quality\n\nThese capabilities support SDLC workflows such as:\n\n- Application modernization, migration, and maintenance\n- Documentation and auditability of legacy systems\n- Alignment of product, engineering, and architecture teams and systems\n- Developer onboarding and code comprehension\n\n---\n\n**Note for POV customers:** If your codebase has already been ingested as part of a proof-of-value (POV) engagement, you can use your existing authentication credentials and skip step 2 (”Ingest a Codebase or Document Source) of this guide.\n\n## 1. Authentication\n\n```\nPOST /api/auth/login\n```\n\nObtain a JWT for future API calls.\n\n**Request:**\n\n```\n{\n  \"email\": \"you@example.com\",\n  \"password\": \"your-password\"\n}\n```\n\n**Response:**\n\n```\n{\n  \"access_token\": \"...\",\n  \"token_type\": \"bearer\"\n}\n```\n\nInclude this token in all subsequent requests:\n\n```\nAuthorization: Bearer <access_token>\n```\n\n---\n\n## 2. Ingest a Codebase or Document Source\n\n```\nPOST /api/vector-store/ingest\n```\n\nTrigger ingestion of code from a Git repo, ZIP file, or local document directory.\n\n**Example Payload (GitHub):**\n\n```\n{\n  \"source_type\": \"url\",\n  \"source\": \"https://github.com/example/repo.git\",\n  \"force\": true\n}\n```\n\nIngestion automatically chunks, embeds, and summarizes source files for downstream analysis.\n\n<details>\n<summary>Supported File Extensions</summary>\n\n### Programming Languages\n- Python: `.py`, `.pyw`, `.pyx`, `.pyi`\n- JavaScript/TypeScript: `.js`, `.mjs`, `.cjs`, `.ts`, `.jsx`, `.tsx`\n- Java: `.java`, `.class`, `.jar`\n- C/C++: `.c`, `.cpp`, `.cc`, `.cxx`, `.c++`, `.h`, `.hpp`, `.hh`, `.hxx`, `.h++`\n- .NET: `.cs`, `.csx`, `.vb`, `.fs`, `.fsx`, `.fsi`\n- PHP: `.php`, `.php3`, `.php4`, `.php5`, `.phtml`\n- Ruby: `.rb`, `.rbw`, `.rake`, `.gemspec`\n- Go: `.go`, `.mod`, `.sum`\n- Rust: `.rs`, `.rlib`\n- Swift: `.swift`\n- Kotlin: `.kt`, `.kts`, `.ktm`\n- Scala: `.scala`, `.sc`\n- Clojure: `.clj`, `.cljs`, `.cljc`, `.edn`\n- Haskell: `.hs`, `.lhs`\n- OCaml: `.ml`, `.mli`, `.mll`, `.mly`\n- R: `.r`, `.R`, `.rmd`, `.rnw`\n- Objective-C: `.m`, `.mm`\n- Perl: `.pl`, `.pm`, `.t`, `.pod`\n- Shell scripts: `.sh`, `.bash`, `.zsh`, `.fish`, `.ksh`, `.csh`, `.tcsh`\n- PowerShell: `.ps1`, `.psm1`, `.psd1`\n- Windows batch: `.bat`, `.cmd`\n- Lua: `.lua`\n- Dart: `.dart`\n- Elm: `.elm`\n- Elixir: `.ex`, `.exs`\n- Erlang: `.erl`, `.hrl`\n- Julia: `.jl`\n- Nim: `.nim`, `.nims`\n- Crystal: `.cr`\n- D: `.d`\n- Pascal: `.pas`, `.pp`, `.inc`\n- Fortran: `.f`, `.f90`, `.f95`, `.f03`, `.f08`, `.for`, `.ftn`, `.fpp`\n- COBOL: `.cob`, `.cbl`, `.cpy`, `.cobol`, `.bms`, `.ctl`, `.jcl`, `.proc`\n- IBM i (AS/400) RPG ILE: `.rpgle`, `.rpgleinc`\n- IBM i (AS/400) CLLE: `.clle`\n- IBM i (AS/400) DDS: `.pf`, `.lf`, `.dspf`\n- PowerBuilder: `.pbt`, `.pbs`, `.pbr`, `.srw`, `.srd`, `.sru`, `.sra`, `.srp`, `.srf`, `.srq`, `.srs`, `.srm`, `.srj`\n- Ada: `.ada`, `.adb`, `.ads`\n- Assembly: `.asm`, `.s`, `.S`\n- Verilog/SystemVerilog: `.v`, `.vh`, `.sv`, `.svh`\n- VHDL: `.vhd`, `.vhdl`\n- Tcl/Tk: `.tcl`, `.tk`\n- Groovy: `.groovy`, `.gvy`, `.gy`, `.gsh`\n- CoffeeScript: `.coffee`, `.litcoffee`\n- PureScript: `.purs`\n- ReasonML: `.reason`, `.re`, `.rei`\n- Racket/Scheme: `.rkt`, `.scm`, `.ss`\n- Lisp: `.lisp`, `.lsp`, `.l`, `.cl`, `.fasl`\n- Prolog: `.prolog`, `.pro`, `.P`\n- MATLAB: `.matlab`, `.fig`\n- Mathematica: `.mathematica`, `.nb`, `.wl`, `.wls`\n- SageMath: `.sage`, `.spyx`\n- Zig: `.zig`\n- Odin: `.odin`\n- V: `.v3`, `.v2`, `.v1`\n- Pony: `.pony`\n- Red: `.red`, `.reds`\n- Io: `.io`\n- Factor: `.factor`\n- Forth: `.forth`, `.fth`, `.4th`\n- J/K/Q/APL: `.j`, `.k`, `.q`, `.apl`\n- Chapel: `.chapel`, `.chpl`\n- X10: `.x10`\n- Arduino/Processing: `.pde`, `.ino`\n\n### Web Technologies\n- HTML: `.html`, `.htm`, `.xhtml`, `.shtml`\n- CSS/Preprocessors: `.css`, `.scss`, `.sass`, `.less`, `.styl`, `.stylus`\n- Frontend frameworks: `.vue`, `.svelte`\n- JSP: `.jsp`, `.jspx`, `.tag`, `.tagx`\n- ASP.NET: `.asp`, `.aspx`, `.ascx`, `.asax`, `.ashx`, `.asmx`\n- Ruby templates: `.erb`, `.haml`, `.slim`\n- PHP templates: `.twig`, `.blade`\n- Template engines: `.mustache`, `.hbs`, `.handlebars`, `.ejs`, `.pug`, `.jade`, `.liquid`, `.ftl`, `.ftlh`, `.vm`, `.vtl`, `.thymeleaf`\n\n### Configuration/Data\n- JSON: `.json`, `.json5`, `.jsonc`, `.jsonl`, `.ndjson`\n- XML: `.xml`, `.xsd`, `.xsl`, `.xslt`, `.dtd`, `.rng`, `.rnc`\n- YAML/TOML: `.yaml`, `.yml`, `.toml`\n- INI/Cfg/Conf: `.ini`, `.cfg`, `.conf`, `.config`, `.properties`\n- Environment: `.env`, `.envrc`, `.env.local`, `.env.development`, `.env.production`\n- Property lists: `.plist`\n- HOCON: `.hocon`\n- RON/HJSON/CSON: `.ron`, `.hjson`, `.cson`\n\n### Documentation/Text\n- Markdown: `.md`, `.markdown`, `.mdown`, `.mkd`, `.mkdn`\n- Plain text: `.txt`, `.text`\n- reStructuredText: `.rst`, `.rest`\n- AsciiDoc: `.asciidoc`, `.adoc`, `.asc`\n- LaTeX: `.tex`, `.latex`, `.ltx`, `.sty`, `.cls`, `.bib`\n- Org mode: `.org`\n- Wiki markup: `.wiki`, `.mediawiki`\n- Textile/Creole/RDoc: `.textile`, `.creole`, `.rdoc`\n\n### Data Formats\n- Delimited: `.csv`, `.tsv`, `.psv`\n- SQL: `.sql`, `.ddl`, `.dml`, `.plsql`, `.psql`, `.mysql`\n- GraphQL: `.graphql`, `.gql`\n- Protocols: `.proto`, `.protobuf`, `.avro`, `.avsc`, `.avdl`, `.thrift`, `.capnp`, `.fbs`\n- Columnar: `.parquet`, `.orc`, `.arrow`\n\n### Build/Dependency\n- Gradle: `.gradle`, `.gradle.kts`\n- Maven: `.maven`, `.mvn`\n- SBT: `.sbt`\n- CMake: `.cmake`, `.cmake.in`\n- Make: `.make`, `.mk`, `.mak`\n- Docker: `.dockerfile`, `.containerfile`, `.dockerignore`\n- Git: `.gitignore`, `.gitattributes`, `.gitmodules`, `.gitkeep`\n- Mercurial/Subversion/Bazaar: `.hgignore`, `.hgrc`, `.svnignore`, `.bzrignore`\n- EditorConfig: `.editorconfig`\n- Linters/Formatters: `.eslintrc`, `.eslintignore`, `.prettierrc`, `.prettierignore`, `.babelrc`, `.babelignore`\n- Node.js: `.npmrc`, `.npmignore`, `.yarnrc`, `.yarnignore`\n- Python: `.pipfile`, `.pipfile.lock`, `.requirements`, `.requirements.txt`, `.poetry.lock`, `.pyproject.toml`, `.setup.py`, `.setup.cfg`, `.manifest.in`, `.tox.ini`, `.noxfile.py`, `.pre-commit-config.yaml`\n- CI/CD: `.github`, `.gitlab-ci.yml`, `.travis.yml`, `.appveyor.yml`, `.circleci`, `.jenkins`, `.jenkinsfile`, `.azure-pipelines.yml`, `.buildkite.yml`\n- Package Managers: `package.json`, `package-lock.json`, `yarn.lock`, `pnpm-lock.yaml`, `composer.json`, `composer.lock`, `gemfile`, `gemfile.lock`, `cargo.toml`, `cargo.lock`, `go.mod`, `go.sum`, `requirements.txt`, `pipfile`, `pipfile.lock`, `poetry.lock`, `pyproject.toml`, `build.gradle`, `build.gradle.kts`, `settings.gradle`, `gradle.properties`, `pom.xml`, `settings.xml`, `build.sbt`, `plugins.sbt`, `makefile`, `gnumakefile`, `makefile.am`, `makefile.in`, `dockerfile`, `containerfile`, `vagrantfile`, `rakefile`, `guardfile`, `capfile`, `gulpfile.js`, `gruntfile.js`, `webpack.config.js`, `rollup.config.js`, `tsconfig.json`, `jsconfig.json`, `deno.json`, `deno.jsonc`, `mix.exs`, `mix.lock`, `rebar.config`, `rebar.lock`, `project.clj`, `deps.edn`, `stack.yaml`, `cabal.config`, `setup.hs`, `dub.json`, `dub.sdl`, `nimble`, `config.nims`, `shard.yml`, `shard.lock`, `pubspec.yaml`, `pubspec.lock`, `elm.json`, `elm-package.json`, `project.json`, `global.json`, `nuget.config`, `packages.config`, `paket.dependencies`, `paket.lock`, `.log`, `.lock`, `.pid`, `.tmp`, `.temp`, `.patch`, `.diff`, `.spec`, `.rpm`, `.deb`, `.control`, `.pkgbuild`, `.ebuild`, `.formula`, `.port`, `.portfile`, `.nix`, `.bzl`, `.bazel`, `.workspace`, `.buck`, `.buckconfig`, `.pants`, `.pants.ini`, `.please`, `.plzconfig`, `.gn`, `.gni`, `.ninja`, `.waf`, `.wscript`, `.scons`, `.sconstruct`, `.sconscript`\n\n</details>\n\n<details>\n<summary>Configuration Files</summary>\n\n- `requirements.txt`\n- `.gitignore`\n- `.dockerignore`\n- `.editorconfig`\n- `.eslintrc.js`\n- `.eslintrc.json`\n- `.prettierrc.js`\n- `.prettierrc.json`\n- `.babelrc.js`\n- `.babelrc.json`\n\n</details>\n\n---\n\n## 3. Generate a Product Requirements Document (PRD)\n\n**Note**: Generating a PRD or technical specification will replace the existing PRD or technical specification. The new outputs will document your codebase as it was when it was most recently ingested.\n\n```\nPOST /api/documents/prd?format=json\n```\n\nGenerates a structured PRD with:\n\n- Executive Overview\n- User Personas\n- High-Level Requirements\n- User Stories\n- Business Value\n\n**Example Response (truncated):**\n\n```\n{\n  \"content\": {\n    \"executive_overview\": \"Modernize internal authentication platform\",\n    \"user_personas\": [...],\n    \"user_stories\": [...]\n  }\n}\n```\n\n**Tip:** For PRDs or technical specs, use `format=markdown` to return a Markdown-formatted document instead.\n\n---\n\n## 4. Generate a Technical Specification\n\n```\nPOST /api/documents/technical-spec?format=json\n```\n\nReturns system-level implementation details including:\n\n- Architecture and Components\n- Data Models and Relationships\n- User Interface Screens and Components\n- APIs and Integration Points\n- System Interfaces and Specifications\n- Security Considerations\n- Implementation and Deployment Strategy\n\n---\n\n## 5. Query Your Code\n\n```\nPOST /api/graph/query-engine\n```\n\nAsk natural language questions about your codebase to return a structured graph of relationships.\n\n**Example Query:**\n\n```\n{\n  \"query\": \"How does the system determine whether a user has admin privileges when accessing the audit log?\"\n}\n```\n\n**Response (truncated):**\n\n```\n{\n  \"summary\": \"When a user requests access to the audit log, the system checks their assigned roles in `AuthService.getUserRoles`. If 'admin' is present, access is granted. This check occurs in `AuditLogController` before querying the log database. The middleware `CheckPermissions` is also invoked on this route.\"\n}\n```\n\n---\n\n## 6. Format and Retrieve Document Sections\n\nUse these endpoints to extract or reformat specific document sections:\n\n- `/api/documents/sections/{doc_type}` → generate a specific section\n- `/api/documents/format/markdown-output/{doc_type}` → format JSON as Markdown\n- `/api/documents/format/pdf-output/{doc_type}` → export PDF\n\nExample section names:\n\n- `executive-overview`\n- `data-models`\n- `system-architecture`\n- `integration-points`\n\n---\n\n## Questions?\n\nAfter reviewing this guide and the API docs, we recommend scheduling a short Q&A call if you have integration-specific needs or want assistance mapping this to your environment.\n"
  version: 1.26.2
servers:
- url: /
  description: Current server
security:
- BearerAuth: []
tags:
- name: document_generation
paths:
  /api/projects/{project_id}/documents/generate:
    post:
      tags:
      - document_generation
      summary: Generate a dynamic document from section definitions
      description: "Generate a document based on explicit section definitions.\n\n    **Modes:**\n    - `stream=true` (default): Returns SSE stream with real-time progress events\n    - `stream=false`: Blocks until complete, returns the final GeneratedDocument as JSON\n\n    This endpoint uses the provided section definitions to extract relevant data from the\n    codebase (features, business rules, APIs, data models) and generates content\n    for each section matching the specified style and format.\n\n    **SSE Progress Events (stream=true):**\n    - `preparing_sections`: Section structure being prepared\n    - `extracting_data`: Extracting features, rules, APIs from codebase\n    - `generating_section`: Generating content for a specific section\n    - `assembling`: Final document assembly\n    - `complete`: Document ready with document_id\n    - `failed`: Generation failed with error message"
      operationId: generate_dynamic_document
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          description: Project ID
          title: Project Id
        description: Project ID
      - name: stream
        in: query
        required: false
        schema:
          type: boolean
          description: If true, stream SSE progress events. If false, block until complete and return document JSON.
          default: true
          title: Stream
        description: If true, stream SSE progress events. If false, block until complete and return document JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentGenerationRequest'
      responses:
        '200':
          description: SSE stream (stream=true) or GeneratedDocument JSON (stream=false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedDocument'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/DocumentEvent'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '500':
          description: Internal server error
        '404':
          description: Project not found
        '422':
          description: Invalid request
  /api/projects/{project_id}/documents/generate/preset:
    post:
      tags:
      - document_generation
      summary: Generate a document from preset section definitions
      description: "Generate a document using preset section definitions resolved from the registry.\n\n    Provide a document_type (e.g., \"project_specification\", \"technical_specification\")\n    and optional overrides. Section definitions are automatically resolved.\n\n    **Modes:**\n    - `stream=true` (default): Returns SSE stream with real-time progress events\n    - `stream=false`: Blocks until complete, returns the final GeneratedDocument as JSON"
      operationId: generate_preset_document
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          description: Project ID
          title: Project Id
        description: Project ID
      - name: stream
        in: query
        required: false
        schema:
          type: boolean
          description: If true, stream SSE progress events.
          default: true
          title: Stream
        description: If true, stream SSE progress events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetDocumentRequest'
            examples:
              tech_spec_minimal:
                summary: Tech Spec (minimal)
                description: Generate a technical specification with all defaults
                value:
                  document_type: technical_specification
              project_spec_minimal:
                summary: Project Spec (minimal)
                description: Generate a project specification (PRD) with all defaults
                value:
                  document_type: project_specification
              tech_spec_with_options:
                summary: Tech Spec (with options)
                description: Technical specification with custom title, instructions, and detailed output
                value:
                  document_type: technical_specification
                  title: My Project Technical Specification
                  instructions: Focus on microservices architecture and API design
                  global_queries:
                  - What are the main services and their responsibilities?
                  options:
                    detail_level: detailed
                    max_tokens_per_section: 3000
                    include_code_examples: true
                    include_source_references: true
              tech_spec_with_overrides:
                summary: Tech Spec (with section overrides)
                description: Technical specification with per-section customization
                value:
                  document_type: technical_specification
                  section_overrides:
                    Executive Summary:
                      instructions: Focus on business value and ROI
                      queries:
                      - What is the main business purpose?
                    Security Considerations:
                      instructions: Include OWASP top 10 analysis
      responses:
        '200':
          description: SSE stream (stream=true) or GeneratedDocument JSON (stream=false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedDocument'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/DocumentEvent'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '500':
          description: Internal server error
        '404':
          description: Project not found
        '422':
          description: Invalid request or unknown document type
  /api/projects/{project_id}/documents:
    get:
      tags:
      - document_generation
      summary: List generated documents
      description: List all generated documents for a project.
      operationId: list_generated_documents
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          description: Project ID
          title: Project Id
        description: Project ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentMetadataSummary'
                title: Response List Generated Documents
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '500':
          description: Internal server error
  /api/projects/{project_id}/documents/{document_id}:
    get:
      tags:
      - document_generation
      summary: Retrieve a generated document
      description: "Retrieve a previously generated document by its ID.\n\n    The document_id is returned in the 'complete' event when using the\n    POST /projects/{project_id}/documents/generate endpoint."
      operationId: get_generated_document
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          description: Project ID
          title: Project Id
        description: Project ID
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          description: Document ID from generation
          title: Document Id
        description: Document ID from generation
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedDocument'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '500':
          description: Internal server error
  /api/projects/{project_id}/documents/{document_id}/download:
    get:
      tags:
      - document_generation
      summary: Download generated document as markdown
      description: Download the generated document as a markdown file.
      operationId: download_generated_document
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          description: Project ID
          title: Project Id
        description: Project ID
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          description: Document ID from generation
          title: Document Id
        description: Document ID from generation
      responses:
        '200':
          description: Successful Response
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '500':
          description: Internal server error
  /api/projects/{project_id}/documents/{document_id}/sections/{section_name}/regenerate:
    post:
      tags:
      - document_generation
      summary: Regenerate a single section of an existing document
      description: "Regenerate one section of a previously generated document.\n\n    Uses the original document's configuration (style, queries, section definitions)\n    and injects dependency context from existing sibling sections.\n\n    Only the requested section is regenerated — dependent sections are NOT\n    cascaded.\n\n    **Modes:**\n    - `stream=true` (default): Returns SSE stream with progress events\n    - `stream=false`: Blocks until complete, returns the updated GeneratedDocument as JSON"
      operationId: regenerate_document_section
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          description: Project ID
          title: Project Id
        description: Project ID
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          description: Document ID
          title: Document Id
        description: Document ID
      - name: section_name
        in: path
        required: true
        schema:
          type: string
          description: Name of the section to regenerate
          title: Section Name
        description: Name of the section to regenerate
      - name: stream
        in: query
        required: false
        schema:
          type: boolean
          description: If true, stream SSE progress events. If false, block until complete and return document JSON.
          default: true
          title: Stream
        description: If true, stream SSE progress events. If false, block until complete and return document JSON.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectionRegenerationRequest'
      responses:
        '200':
          description: SSE stream (stream=true) or updated GeneratedDocument JSON (stream=false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedDocument'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/DocumentEvent'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '500':
          description: Internal server error
        '404':
          description: Project, document, or section not found
        '422':
          description: Invalid request or section definition not found
components:
  schemas:
    GeneratedSection:
      properties:
        name:
          type: string
          title: Name
          description: Section heading
        level:
          type: integer
          maximum: 6.0
          minimum: 1.0
          title: Level
          description: Heading level
        content:
          type: string
          title: Content
          description: Generated markdown content
        structured_content:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Structured Content
          description: Structured JSON content when an output_schema was used. Takes precedence over `content` for legacy PRDStep storage.
        sources:
          items:
            type: string
          type: array
          title: Sources
          description: Source files referenced
        subsections:
          items:
            $ref: '#/components/schemas/GeneratedSection'
          type: array
          title: Subsections
          description: Generated subsections
      type: object
      required:
      - name
      - level
      - content
      title: GeneratedSection
      description: A generated section of the document.
    SectionDefinition:
      properties:
        name:
          type: string
          title: Name
          description: Section heading/title
        level:
          type: integer
          maximum: 6.0
          minimum: 1.0
          title: Level
          description: Heading level (1-6)
          default: 2
        description:
          type: string
          title: Description
          description: Context for intent derivation. Describes what this section should cover.
          default: ''
        queries:
          items:
            anyOf:
            - type: string
            - $ref: '#/components/schemas/QueryItem'
          type: array
          title: Queries
          description: Research queries for this section.
        depends_on:
          items:
            type: string
          type: array
          title: Depends On
          description: Section names that must be generated before this section. Their output will be available as context during generation.
        dependency_context_mode:
          type: string
          enum:
          - full
          - summary
          title: Dependency Context Mode
          description: 'How to include dependency content: ''full'' or ''summary''.'
          default: summary
        instructions:
          type: string
          title: Instructions
          description: 'Section-specific instructions. Combined with global instructions to guide content generation. Example: ''Keep brief'' or ''Include code examples''.'
          default: ''
        derive_from_context:
          type: boolean
          title: Derive From Context
          description: If True, skip codebase research and generate content purely from dependency context and instructions. Use for synthesis sections like 'User Stories from Requirements'.
          default: false
        polish:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Polish
          description: Whether to polish this section. None = inherit from global setting. True = always polish. False = skip polishing.
        polish_instructions:
          type: string
          title: Polish Instructions
          description: Section-specific polish instructions. Combined with global polish_instructions.
          default: ''
        output_schema:
          anyOf:
          - {}
          - type: 'null'
          title: Output Schema
          description: Pydantic model for LLM structured output. When set, the section generator uses structured-output mode and the result is stored as JSON in PRDStep.content. Set programmatically on preset definitions; not serializable to/from JSON.
        subsections:
          items:
            $ref: '#/components/schemas/SectionDefinition'
          type: array
          title: Subsections
          description: Nested subsections. These are generated recursively.
        research_strategy:
          type: string
          enum:
          - legacy
          - react_per_feature
          title: Research Strategy
          description: Which generation pipeline to use for this section. 'legacy' keeps the orchestrator-based research path; 'react_per_feature' delegates to PerFeatureUserStoryGenerator and requires upstream feature extraction.
          default: legacy
      additionalProperties: false
      type: object
      required:
      - name
      title: SectionDefinition
      description: "Complete section definition for document generation.\n\nCombines section identity (name, level) with generation configuration\n(queries, depends_on, etc.) in a single model. This is the only section\nmodel used throughout the pipeline.\n\nExample:\n    SectionDefinition(\n        name=\"User Stories\",\n        level=2,\n        description=\"User stories derived from requirements\",\n        depends_on=[\"Requirements\"],\n        derive_from_context=True,\n        instructions=\"Generate user stories in standard format with acceptance criteria.\",\n        subsections=[\n            SectionDefinition(\n                name=\"Authentication Stories\",\n                queries=[\"What authentication user stories can be derived?\"],\n            ),\n            SectionDefinition(\n                name=\"Payment Stories\",\n                queries=[\"What payment user stories can be derived?\"],\n            ),\n        ],\n    )"
    ErrorSchema:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      type: object
      required:
      - error
      title: ErrorSchema
    app__documents__schemas__DocumentType:
      type: string
      enum:
      - project_specification
      - technical_specification
      - api_documentation
      - architecture_document
      - user_guide
      - custom
      title: DocumentType
      description: Known document types with specialized handling.
    ErrorBody:
      properties:
        message:
          type: string
          title: Message
        type:
          type: string
          title: Type
        details:
          additionalProperties: true
          type: object
          title: Details
          description: Optional extra context for the error.
      type: object
      required:
      - message
      - type
      title: ErrorBody
    DocumentMetadata:
      properties:
        generated_at:
          type: string
          format: date-time
          title: Generated At
        project_id:
          type: integer
          title: Project Id
        project_name:
          type: string
          title: Project Name
          default: ''
        document_type:
          $ref: '#/components/schemas/DocumentType-Output'
        instructions_used:
          type: string
          title: Instructions Used
          default: ''
        template_hash:
          type: string
          title: Template Hash
          default: ''
        sources:
          items:
            type: string
          type: array
          title: Sources
          description: All source files referenced
        extraction_stats:
          additionalProperties:
            type: integer
          type: object
          title: Extraction Stats
          description: Stats like features_found, rules_found, etc.
        generation_time_seconds:
          type: number
          title: Generation Time Seconds
          default: 0.0
      type: object
      required:
      - project_id
      - document_type
      title: DocumentMetadata
      description: Metadata about the generated document.
    DocumentEvent:
      description: Event emitted during document generation.
      properties:
        event_type:
          default: progress
          title: Event Type
          type: string
        stage:
          description: Current generation stage
          title: Stage
          type: string
        progress:
          description: Overall progress
          maximum: 1.0
          minimum: 0.0
          title: Progress
          type: number
        message:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Message
        section:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Current section being generated
          title: Section
        extraction_type:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Current extraction type if extracting
          title: Extraction Type
        items_found:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          description: Number of items found during extraction
          title: Items Found
        document_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Document ID when complete
          title: Document Id
        error:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Error message if failed
          title: Error
      required:
      - stage
      - progress
      title: DocumentEvent
      type: object
    SectionRegenerationRequest:
      properties:
        instructions:
          type: string
          title: Instructions
          description: Custom instructions for this regeneration. Merged with original document instructions.
          default: ''
        polish:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Polish
          description: Override polish setting for this regeneration. None = use original document setting.
      type: object
      title: SectionRegenerationRequest
      description: Request body for regenerating a single section of an existing document.
    DocumentGenerationRequest:
      properties:
        document_type:
          $ref: '#/components/schemas/app__documents__schemas__DocumentType'
          description: Type of document to generate
          default: project_specification
        section_definitions:
          items:
            $ref: '#/components/schemas/SectionDefinition'
          type: array
          title: Section Definitions
          description: Explicit section definitions. Sections are generated in the order specified.
        style:
          anyOf:
          - $ref: '#/components/schemas/TemplateStyle'
          - type: 'null'
          description: Writing style. If not provided, uses sensible defaults based on document_type.
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
          description: Document title.
        instructions:
          type: string
          title: Instructions
          description: Custom instructions (focus areas, exclusions, etc.)
          default: ''
        global_queries:
          items:
            type: string
          type: array
          title: Global Queries
          description: Queries to run for all sections (e.g., 'What is the purpose of this system?')
        auto_research:
          type: boolean
          title: Auto Research
          description: Auto-generate relevant queries for each section based on its content type
          default: true
        questions:
          items:
            type: string
          type: array
          title: Questions
          description: (Deprecated) Use global_queries instead. Questions applied to all sections.
        options:
          $ref: '#/components/schemas/DocumentOptions'
          description: Generation options
      additionalProperties: false
      type: object
      required:
      - section_definitions
      title: DocumentGenerationRequest
      description: "Request to generate a dynamic document.\n\nProvide `section_definitions` for full control over document structure,\nalong with optional `style`, `title`, and `instructions`.\n\nExample:\n    DocumentGenerationRequest(\n        title=\"MyApp Technical Specification\",\n        document_type=DocumentType.TECH_SPEC,\n        style=TemplateStyle(tone=\"formal\", uses_tables=True),\n        section_definitions=[\n            SectionDefinition(name=\"Overview\", level=2, queries=[\"What does the system do?\"]),\n            SectionDefinition(name=\"Architecture\", level=2, depends_on=[\"Overview\"]),\n        ],\n    )"
    DocumentType-Output:
      type: string
      enum:
      - project_specification
      - technical_specification
      - api_documentation
      - architecture_document
      - user_guide
      - custom
      title: DocumentType
      description: Known document types with specialized handling.
    DocumentMetadataSummary:
      properties:
        id:
          type: string
          title: Id
        title:
          type: string
          title: Title
        document_type:
          type: string
          title: Document Type
        generated_at:
          type: string
          format: date-time
          title: Generated At
        project_id:
          type: integer
          title: Project Id
        section_count:
          type: integer
          title: Section Count
      type: object
      required:
      - id
      - title
      - document_type
      - generated_at
      - project_id
      - section_count
      title: DocumentMetadataSummary
      description: Summary metadata for listing documents.
    DocumentOptions:
      properties:
        include_code_examples:
          type: boolean
          title: Include Code Examples
          description: Include code snippets where relevant
          default: true
        include_diagrams:
          type: boolean
          title: Include Diagrams
          description: Generate Mermaid diagrams
          default: true
        include_business_rules:
          type: boolean
          title: Include Business Rules
          description: Include business rules section
          default: true
        include_source_references:
          type: boolean
          title: Include Source References
          description: Include references to source files
          default: true
        detail_level:
          type: string
          enum:
          - brief
          - standard
          - detailed
          title: Detail Level
          description: Level of detail in generated content
          default: standard
        output_format:
          type: string
          enum:
          - markdown
          - html
          - pdf
          title: Output Format
          description: Output format
          default: markdown
        max_tokens_per_section:
          type: integer
          maximum: 10000.0
          minimum: 500.0
          title: Max Tokens Per Section
          description: Approximate max tokens per section
          default: 2000
        polish:
          type: boolean
          title: Polish
          description: Whether to polish sections. Each section is polished individually after generation. Per-section polish settings in SectionDefinition can override this.
          default: true
        polish_instructions:
          type: string
          title: Polish Instructions
          description: Custom instructions for the polishing step (e.g., 'relate user stories to functional requirements')
          default: ''
        reference_validation:
          type: string
          enum:
          - hybrid
          - llm
          - none
          title: Reference Validation
          description: 'Post-generation reference validation mode. ''hybrid'' (default): regex structural checks + semantic LLM validation for compliance claims, personas, packages, data models, and unformatted file paths, followed by a single LLM correction call if issues are found. ''llm'': legacy LLM extraction-only mode — extracts all references via structured LLM call and cross-checks against the manifest. ''none'': skip post-generation validation.'
          default: hybrid
      additionalProperties: false
      type: object
      title: DocumentOptions
      description: Options for document generation.
    TemplateStyle:
      properties:
        tone:
          type: string
          enum:
          - formal
          - technical
          - casual
          - mixed
          title: Tone
          default: technical
        uses_tables:
          type: boolean
          title: Uses Tables
          default: false
        uses_diagrams:
          type: boolean
          title: Uses Diagrams
          default: false
        uses_code_blocks:
          type: boolean
          title: Uses Code Blocks
          default: false
        uses_bullet_lists:
          type: boolean
          title: Uses Bullet Lists
          default: true
        uses_numbered_lists:
          type: boolean
          title: Uses Numbered Lists
          default: false
        heading_style:
          type: string
          enum:
          - title_case
          - sentence_case
          - uppercase
          title: Heading Style
          default: title_case
        section_numbering:
          type: boolean
          title: Section Numbering
          default: false
        estimated_detail_level:
          type: string
          enum:
          - brief
          - standard
          - detailed
          title: Estimated Detail Level
          default: standard
      type: object
      title: TemplateStyle
      description: Writing style characteristics extracted from template.
    QueryItem:
      properties:
        topic:
          type: string
          title: Topic
          description: The research query/question
      type: object
      required:
      - topic
      title: QueryItem
      description: A research query.
    PresetDocumentRequest:
      properties:
        document_type:
          $ref: '#/components/schemas/app__documents__schemas__DocumentType'
          description: Document type whose preset definitions to use
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
          description: Document title. If not provided, auto-generated from document_type.
        instructions:
          type: string
          title: Instructions
          description: Custom instructions (focus areas, exclusions, etc.)
          default: ''
        global_queries:
          items:
            type: string
          type: array
          title: Global Queries
          description: Queries to run for all sections
        options:
          $ref: '#/components/schemas/DocumentOptions'
          description: Generation options
        style:
          anyOf:
          - $ref: '#/components/schemas/TemplateStyle'
          - type: 'null'
          description: Writing style override
        section_overrides:
          anyOf:
          - additionalProperties:
              additionalProperties: true
              type: object
            type: object
          - type: 'null'
          title: Section Overrides
          description: Per-section field overrides. Maps section name to dict of SectionDefinition field overrides.
      additionalProperties: false
      type: object
      required:
      - document_type
      title: PresetDocumentRequest
      description: 'Request to generate a document using preset section definitions.


        Section definitions are resolved from the SectionDefinitionRegistry

        based on document_type. Supports optional per-section overrides.'
    GeneratedDocument:
      properties:
        id:
          type: string
          title: Id
          description: Unique document ID
        title:
          type: string
          title: Title
          description: Document title
        document_type:
          $ref: '#/components/schemas/DocumentType-Output'
        sections:
          items:
            $ref: '#/components/schemas/GeneratedSection'
          type: array
          title: Sections
        content:
          type: string
          title: Content
          description: Full assembled markdown content
          default: ''
        metadata:
          $ref: '#/components/schemas/DocumentMetadata'
        request_payload:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Request Payload
          description: Original generation request payload for re-running
      type: object
      required:
      - id
      - title
      - document_type
      - metadata
      title: GeneratedDocument
      description: Complete generated document.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter the Bearer token from Clerk authentication
