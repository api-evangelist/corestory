openapi: 3.2.0
info:
  title: Crowdbotics API Documentation Cache API
  description: '# CoreStory API Overview


    The CoreStory API provides programmatic access to structured insights derived from software source code.'
  version: 1.26.2
servers:
- url: /
  description: Current server
security:
- BearerAuth: []
tags:
- name: Cache
paths:
  /api/graph/cache/stats:
    get:
      tags:
      - Cache
      summary: Get cache statistics
      description: Get statistics about the graph query cache including hit/miss rates and entry counts.
      operationId: get_cache_stats
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
  /api/graph/cache:
    delete:
      tags:
      - Cache
      summary: Clear cache
      description: Clear the entire graph query cache, or remove a specific cache entry by key.
      operationId: clear_cache
      parameters:
      - name: key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Specific cache key to remove
          title: Key
        description: Specific cache key to remove
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
  /api/graph/cache/ttl:
    put:
      tags:
      - Cache
      summary: Update cache TTL
      description: Update the cache Time To Live value. The new TTL applies to all future cache entries.
      operationId: update_cache_ttl
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CacheTTLUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
  /api/graph/cache/entry/{cache_key}:
    get:
      tags:
      - Cache
      summary: Get detailed information about a specific cache entry
      description: 'Retrieve detailed information about a specific cache entry using its cache key.

        This includes the original request, cached response, and metadata about the cache entry.


        The response includes:

        * Original request parameters

        * Cached response data

        * Cache metadata (creation time, TTL, expiration status)


        Example response:

        ```json

        {

        "cache_key": "abc123...",

        "request": {

        "query": "Show me the relationships between payment and vendor",

        "max_nodes": 20,

        "min_similarity": 0.3

        },

        "response": {

        "nodes": [...],

        "edges": [...],

        "metadata": {...},

        "summary": {...}

        },

        "metadata": {

        "created_at": 1234567890.123,

        "ttl_seconds": 3600,

        "ttl_remaining": 1800.5,

        "is_expired": false

        }

        }

        ```'
      operationId: get_cache_entry
      parameters:
      - name: cache_key
        in: path
        required: true
        schema:
          type: string
          description: The cache key to look up
          title: Cache Key
        description: The cache key to look up
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Cache Entry
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
  /api/graph/cache/dump:
    get:
      tags:
      - Cache
      summary: Dump the entire cache contents
      description: 'Retrieve the complete contents of the cache, including all keys and values.

        This endpoint returns detailed information about every cache entry, including:

        * Cache keys

        * Original requests

        * Cached responses

        * Metadata for each entry


        This is useful for:

        * Debugging cache issues

        * Analyzing cache contents

        * Backing up cache data

        * Migrating cache data between instances'
      operationId: dump_cache
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Dump Cache
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
  /api/graph/cache/set:
    post:
      tags:
      - Cache
      summary: Set cache entries
      description: 'Set one or more cache entries using the same format as the dump endpoint.

        This allows you to easily copy-paste the output from /api/graph/cache/dump

        to restore or update cache entries.


        The request should match the format of the dump endpoint:

        ```json

        {

        "entries": [

        {

        "cache_key": "abc123...",

        "request": {

        "query": "Show me the relationships between payment and vendor",

        "max_nodes": 20,

        "min_similarity": 0.3

        },

        "response": {

        "nodes": [...],

        "edges": [...],

        "metadata": {...},

        "summary": {...}

        },

        "metadata": {

        "created_at": 1234567890.123,

        "ttl_seconds": 3600,

        "ttl_remaining": 1800.5,

        "is_expired": false

        }

        }

        ]

        }

        ```'
      operationId: set_cache_entries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CacheSetRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Set Cache Entries
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
components:
  schemas:
    CacheEntryMetadata:
      properties:
        created_at:
          type: number
          title: Created At
          description: Timestamp when the entry was created
        ttl_seconds:
          type: integer
          title: Ttl Seconds
          description: TTL in seconds
        ttl_remaining:
          type: number
          title: Ttl Remaining
          description: Remaining TTL in seconds
        is_expired:
          type: boolean
          title: Is Expired
          description: Whether the entry has expired
      type: object
      required:
      - created_at
      - ttl_seconds
      - ttl_remaining
      - is_expired
      title: CacheEntryMetadata
      description: Metadata for a cache entry
    ErrorSchema:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      type: object
      required:
      - error
      title: ErrorSchema
    CacheSetRequest:
      properties:
        entries:
          items:
            $ref: '#/components/schemas/CacheEntry'
          type: array
          title: Entries
          description: List of cache entries to set
      type: object
      required:
      - entries
      title: CacheSetRequest
      description: Request model for setting cache entries
    ErrorBody:
      properties:
        message:
          type: string
          title: Message
        type:
          type: string
          title: Type
        details:
          additionalProperties: true
          type: object
          title: Details
          description: Optional extra context for the error.
      type: object
      required:
      - message
      - type
      title: ErrorBody
    CacheEntry:
      properties:
        cache_key:
          type: string
          title: Cache Key
          description: The cache key
        request:
          additionalProperties: true
          type: object
          title: Request
          description: The original request data
        response:
          additionalProperties: true
          type: object
          title: Response
          description: The cached response data
        metadata:
          $ref: '#/components/schemas/CacheEntryMetadata'
          description: Cache entry metadata
      type: object
      required:
      - cache_key
      - request
      - response
      - metadata
      title: CacheEntry
      description: Model for a single cache entry
    CacheTTLUpdate:
      properties:
        ttl_seconds:
          type: integer
          exclusiveMinimum: 0.0
          title: Ttl Seconds
          description: New TTL value in seconds (must be positive)
          example: 7200
      type: object
      required:
      - ttl_seconds
      title: CacheTTLUpdate
      description: Request model for updating cache TTL
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter the Bearer token from Clerk authentication
