      - reason
      title: GrantCreditsRequest
      description: Request schema for manually granting CIU credits to an organization.
    GrantCreditsResponse:
      properties:
        credits_added:
          type: integer
          title: Credits Added
          description: Number of CIU credits that were added
        new_balance:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: New Balance
          description: The organization's total CIU balance after the grant
        provisioned_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Provisioned By
          description: Clerk user ID of the superuser who granted the credits
        reason:
          type: string
          title: Reason
          description: Reason for granting credits
        created_at:
          type: string
          format: date-time
          title: Created At
          description: When the credits were granted
      type: object
      required:
      - credits_added
      - new_balance
      - reason
      - created_at
      title: GrantCreditsResponse
      description: Response schema for manually granted CIU credits.
    EnterpriseProvisionRequest:
      properties:
        plan_slug:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Plan Slug
          description: Slug of the sales-managed plan to provision onto (e.g. 'business', 'enterprise_1m', 'enterprise_10m'). Defaults to the largest Enterprise bracket.
        reason:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Reason
          description: Provisioning reason for audit trail, e.g. 'Contract signed 2026-03-01'
      type: object
      title: EnterpriseProvisionRequest
      description: Request body for provisioning an org onto a sales-managed plan.
    ErrorSchema:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      type: object
      required:
      - error
      title: ErrorSchema
    EnterpriseDowngradeResponse:
      properties:
        organization_id:
          type: string
          title: Organization Id
          description: Organization database ID
        clerk_org_id:
          type: string
          title: Clerk Org Id
          description: Clerk organization ID
        plan:
          type: string
          title: Plan
          description: Resulting plan tier name
        downgraded_at:
          type: string
          format: date-time
          title: Downgraded At
          description: When the downgrade occurred
      type: object
      required:
      - organization_id
      - clerk_org_id
      - plan
      - downgraded_at
      title: EnterpriseDowngradeResponse
      description: Response after successfully downgrading an org from the Enterprise plan.
    SyncFromClerkResponse:
      properties:
        organization:
          $ref: '#/components/schemas/OrganizationResponse'
        members_synced:
          type: integer
          title: Members Synced
          default: 0
        members_failed:
          type: integer
          title: Members Failed
          default: 0
        message:
          type: string
          title: Message
      type: object
      required:
      - organization
      - message
      title: SyncFromClerkResponse
      description: Response from Clerk sync operation.
    InviteMemberRequest:
      properties:
        email_address:
          type: string
          format: email
          title: Email Address
          description: Email address to send the invitation to.
        role:
          type: string
          enum:
          - org:member
          - org:admin
          - org:owner
          - org:collaborator
          title: Role
          description: Role to assign the invited user.
          default: org:member
        redirect_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Redirect Url
          description: URL the invitee lands on after accepting the invitation.
      type: object
      required:
      - email_address
      title: InviteMemberRequest
      description: Request to invite a member to an organization via email.
    OrganizationUpdate:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Name
        slug:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Slug
        timezone:
          anyOf:
          - type: string
          - type: 'null'
          title: Timezone
          description: IANA timezone, e.g. 'America/New_York'.
      type: object
      title: OrganizationUpdate
      description: Schema for updating an organization.
    IngestionConfigResponse:
      properties:
        supported_extensions:
          items:
            type: string
          type: array
          title: Supported Extensions
          description: List of supported file extensions
        binary_extensions:
          items:
            type: string
          type: array
          title: Binary Extensions
          description: List of binary file extensions
        is_custom:
          type: boolean
          title: Is Custom
          description: True if organization has custom config, False if using defaults
        supported_extensions_count:
          type: integer
          title: Supported Extensions Count
          description: Number of supported extensions
        binary_extensions_count:
          type: integer
          title: Binary Extensions Count
          description: Number of binary extensions
      type: object
      required:
      - supported_extensions
      - binary_extensions
      - is_custom
      - supported_extensions_count
      - binary_extensions_count
      title: IngestionConfigResponse
      description: Schema for ingestion configuration response.
    SyncFromClerkRequest:
      properties:
        clerk_org_id:
          type: string
          title: Clerk Org Id
          description: Clerk organization ID to sync
        sync_members:
          type: boolean
          title: Sync Members
          description: Whether to sync members
          default: true
      type: object
      required:
      - clerk_org_id
      title: SyncFromClerkRequest
      description: Request to sync organization from Clerk.
    SyncStatusSummary:
      properties:
        total_count:
          type: integer
          title: Total Count
          description: Total projects across the organization ignoring filter
        auto_count:
          type: integer
          title: Auto Count
          description: Projects with sync_mode=auto across the org
        blocked_count:
          type: integer
          title: Blocked Count
          description: Projects with status=couldnt_process across the org
        is_ciu_exhausted:
          type: boolean
          title: Is Ciu Exhausted
          description: Whether the org has run out of CIUs
      type: object
      required:
      - total_count
      - auto_count
      - blocked_count
      - is_ciu_exhausted
      title: SyncStatusSummary
      description: Org-wide aggregates rendered as page-level chrome. Not affected by filters.
    SyncStatusResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/SyncStatusItem'
          type: array
          title: Items
          description: List of items
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
          description: Pagination metadata
        summary:
          $ref: '#/components/schemas/SyncStatusSummary'
          description: Org-wide aggregates (unaffected by filters)
      type: object
      required:
      - items
      - pagination
      - summary
      title: SyncStatusResponse
      description: Paginated project sync-status list with org-wide summary aggregates.
    AddMemberRequest:
      properties:
        user_clerk_id:
          type: string
          title: User Clerk Id
          description: Clerk user ID to add
        role_id:
          type: string
          title: Role Id
          description: Role to assign
          default: org:member
      type: object
      required:
      - user_clerk_id
      title: AddMemberRequest
      description: Request to add a member to an organization.
    OrgMembershipResponse:
      properties:
        role_id:
          type: string
          title: Role Id
          description: Role ID from Clerk (e.g., org:admin)
        user:
          $ref: '#/components/schemas/UserSummary'
        joined_at:
          type: string
          format: date-time
          title: Joined At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        is_admin:
          type: boolean
          title: Is Admin
        is_owner:
          type: boolean
          title: Is Owner
      type: object
      required:
      - role_id
      - user
      - joined_at
      - updated_at
      - is_admin
      - is_owner
      title: OrgMembershipResponse
      description: Schema for organization membership API response.
    ScheduleCadence:
      type: string
      enum:
      - daily
      - weekly
      - monthly
      title: ScheduleCadence
      description: How frequently the org schedule runs.
    IngestionConfigUpdate:
      properties:
        supported_extensions:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Supported Extensions
          description: List of file extensions to process (e.g., ['.py', '.js']). Overrides global defaults.
          examples:
          - - .py
            - .js
            - .ts
            - .tsx
            - .jsx
        binary_extensions:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Binary Extensions
          description: List of binary file extensions to skip (e.g., ['.png', '.jpg']). Overrides global defaults.
          examples:
          - - .png
            - .jpg
            - .pdf
            - .exe
      type: object
      title: IngestionConfigUpdate
      description: Schema for fully replacing ingestion configuration (PUT).
    JobStatus:
      type: string
      enum:
      - not_started
      - running
      - completed
      - failed
      - cancelled
      title: JobStatus
      description: Job status enumeration
    UserSummary:
      properties:
        id:
          type: string
          title: Id
        email:
          type: string
          title: Email
        first_name:
          anyOf:
          - type: string
          - type: 'null'
          title: First Name
        last_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Name
        clerk_uid:
          type: string
          title: Clerk Uid
      type: object
      required:
      - id
      - email
      - clerk_uid
      title: UserSummary
      description: Summary of user for membership responses.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter the Bearer token from Clerk authentication
