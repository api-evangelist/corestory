      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantCreditsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
components:
  schemas:
    UpdateScheduleResponse:
      properties:
        id:
          type: string
          title: Id
        organization_id:
          type: string
          title: Organization Id
        cadence:
          $ref: '#/components/schemas/ScheduleCadence'
        day_of_week:
          anyOf:
          - type: integer
          - type: 'null'
          title: Day Of Week
        day_of_month:
          anyOf:
          - type: integer
          - type: 'null'
          title: Day Of Month
        time:
          type: string
          title: Time
        doc_sync:
          type: boolean
          title: Doc Sync
        last_edited_by_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Edited By Id
        last_edited_by_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Edited By Name
        last_edited_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Edited At
        timezone:
          type: string
          title: Timezone
          default: UTC
        next_run_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Next Run At
        is_running:
          type: boolean
          title: Is Running
          default: false
        auto_codebases_count:
          type: integer
          title: Auto Codebases Count
          default: 0
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - organization_id
      - cadence
      - time
      - doc_sync
      - created_at
      - updated_at
      title: UpdateScheduleResponse
      description: Response for org update schedule, includes computed fields.
    SyncStatusItem:
      properties:
        project_id:
          type: integer
          title: Project Id
          description: Project ID
        name:
          type: string
          title: Name
          description: Project name
        sync_mode:
          $ref: '#/components/schemas/SyncMode'
          description: Manual or Auto
        status:
          $ref: '#/components/schemas/ProjectSyncStatus'
          description: Current sync/processing status
        last_ingested_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Ingested At
          description: Last successful ingestion timestamp
      type: object
      required:
      - project_id
      - name
      - sync_mode
      - status
      title: SyncStatusItem
      description: A single project row in the org project sync-status list.
    ProjectSyncStatus:
      type: string
      enum:
      - up_to_date
      - updating
      - stale
      - failed
      - couldnt_process
      title: ProjectSyncStatus
      description: Sync/processing status for a project in the org roster.
    SetPersonalResponse:
      properties:
        success:
          type: boolean
          title: Success
        organization_id:
          type: string
          title: Organization Id
      type: object
      required:
      - success
      - organization_id
      title: SetPersonalResponse
      description: Response from marking an organization as personal.
    IngestionConfigPatch:
      properties:
        supported_extensions:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Supported Extensions
          description: Additional file extensions to process. Merged with current config (additive).
          examples:
          - - .gltf
            - .proto
        binary_extensions:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Binary Extensions
          description: Additional binary file extensions to skip. Merged with current config (additive).
          examples:
          - - .glb
            - .fbx
      type: object
      title: IngestionConfigPatch
      description: Schema for additively merging extensions into ingestion configuration (PATCH).
    EnterpriseProvisionResponse:
      properties:
        organization_id:
          type: string
          title: Organization Id
          description: Organization database ID
        clerk_org_id:
          type: string
          title: Clerk Org Id
          description: Clerk organization ID
        plan:
          type: string
          title: Plan
          description: Plan tier name
        total_cius:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Total Cius
          description: Total CIUs allocated
        consumed_cius:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Consumed Cius
          description: CIUs consumed in current cycle
        available_cius:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Available Cius
          description: Remaining available CIUs
        renewal_date:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Renewal Date
          description: Next renewal date
        provisioned_at:
          type: string
          format: date-time
          title: Provisioned At
          description: When the provisioning occurred
      type: object
      required:
      - organization_id
      - clerk_org_id
      - plan
      - total_cius
      - consumed_cius
      - available_cius
      - renewal_date
      - provisioned_at
      title: EnterpriseProvisionResponse
      description: Response after successfully provisioning an org onto the Enterprise plan.
    PinWorkspaceRequest:
      properties:
        project_id:
          type: integer
          title: Project Id
          description: ID of the workspace (project) to pin.
      type: object
      required:
      - project_id
      title: PinWorkspaceRequest
      description: Body for pinning a workspace.
    SyncMode:
      type: string
      enum:
      - manual
      - auto
      title: SyncMode
      description: Whether a project syncs manually or automatically with its repo.
    UpdateMemberRoleRequest:
      properties:
        role_id:
          type: string
          title: Role Id
          description: New role ID
      type: object
      required:
      - role_id
      title: UpdateMemberRoleRequest
      description: Request to update a member's role.
    OrganizationInvitationResponse:
      properties:
        id:
          type: string
          title: Id
        email_address:
          type: string
          title: Email Address
        role:
          type: string
          title: Role
        status:
          type: string
          title: Status
        created_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Created At
      type: object
      required:
      - id
      - email_address
      - role
      - status
      title: OrganizationInvitationResponse
      description: Response from creating an organization invitation.
    ErrorBody:
      properties:
        message:
          type: string
          title: Message
        type:
          type: string
          title: Type
        details:
          additionalProperties: true
          type: object
          title: Details
          description: Optional extra context for the error.
      type: object
      required:
      - message
      - type
      title: ErrorBody
    UpdateScheduleUpsert:
      properties:
        cadence:
          $ref: '#/components/schemas/ScheduleCadence'
        day_of_week:
          anyOf:
          - type: integer
            maximum: 6.0
            minimum: 0.0
          - type: 'null'
          title: Day Of Week
          description: 0=Monday..6=Sunday. Required when weekly.
        day_of_month:
          anyOf:
          - type: integer
            maximum: 28.0
            minimum: 1.0
          - type: 'null'
          title: Day Of Month
          description: 1-28. Required when monthly.
        time:
          type: string
          pattern: ^([01]\d|2[0-3]):(00|30)$
          title: Time
          description: HH:MM in 24h format. Must be on a 30-minute boundary (e.g. 09:00, 09:30).
        doc_sync:
          type: boolean
          title: Doc Sync
          default: true
      type: object
      required:
      - cadence
      - time
      title: UpdateScheduleUpsert
      description: Create or update an org update schedule. Single atomic operation.
    PaginationMeta:
      properties:
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        size:
          type: integer
          title: Size
        pages:
          type: integer
          title: Pages
      type: object
      required:
      - total
      - page
      - size
      - pages
      title: PaginationMeta
    EnterpriseDowngradeRequest:
      properties:
        reason:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Reason
          description: Downgrade reason for audit trail, e.g. 'Contract ended 2026-03-24'
      type: object
      title: EnterpriseDowngradeRequest
      description: Request body for downgrading an org from the Enterprise plan.
    OrganizationResponse:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
        slug:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Slug
        id:
          type: string
          title: Id
        clerk_org_id:
          type: string
          title: Clerk Org Id
        timezone:
          type: string
          title: Timezone
          default: UTC
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        members_count:
          type: integer
          title: Members Count
          default: 0
        projects_count:
          type: integer
          title: Projects Count
          default: 0
        plan_tier:
          type: string
          title: Plan Tier
          default: free
      type: object
      required:
      - name
      - id
      - clerk_org_id
      - created_at
      - updated_at
      title: OrganizationResponse
      description: Schema for organization API response.
    PinnedWorkspaceItem:
      properties:
        project_id:
          type: integer
          title: Project Id
          description: Workspace (project) ID.
        name:
          type: string
          title: Name
          description: Workspace name.
        repo_slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Repo Slug
          description: Repository slug in 'owner/repo' form, if known.
        status:
          $ref: '#/components/schemas/ProjectSyncStatus'
          description: Current ingestion/sync status of the workspace.
        pinned_at:
          type: string
          format: date-time
          title: Pinned At
          description: When the workspace was pinned (drives pin order).
        is_stale:
          type: boolean
          title: Is Stale
          description: Whether the workspace intelligence is out of sync with the repo.
          default: false
        last_ingested_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Ingested At
          description: Timestamp of the last successful ingestion.
        ingestion_status:
          $ref: '#/components/schemas/JobStatus'
          description: Status of the workspace's latest ingestion job.
          default: not_started
      type: object
      required:
      - project_id
      - name
      - status
      - pinned_at
      title: PinnedWorkspaceItem
      description: A single pinned workspace, annotated with workspace metadata for display.
    OrganizationWithMembers:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
        slug:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Slug
        id:
          type: string
          title: Id
        clerk_org_id:
          type: string
          title: Clerk Org Id
        timezone:
          type: string
          title: Timezone
          default: UTC
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        members_count:
          type: integer
          title: Members Count
          default: 0
        projects_count:
          type: integer
          title: Projects Count
          default: 0
        plan_tier:
          type: string
          title: Plan Tier
          default: free
        members:
          items:
            $ref: '#/components/schemas/OrgMembershipResponse'
          type: array
          title: Members
          default: []
      type: object
      required:
      - name
      - id
      - clerk_org_id
      - created_at
      - updated_at
      title: OrganizationWithMembers
      description: Organization with members list.
    GrantCreditsRequest:
