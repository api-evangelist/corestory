  /api/organizations/{org_id}/provision-enterprise:
    post:
      tags:
      - organizations
      summary: Provision an organization onto a sales-managed plan (Business or Enterprise)
      description: 'Manually provision an organization onto a sales-managed plan.


        Superuser-only. Provisions the org onto the plan given by ``plan_slug``

        (Business or any Enterprise variant; defaults to the largest Enterprise

        bracket), allocating that plan''s CIU allowance, writing a ledger entry, and

        syncing the plan family to Clerk metadata.


        Idempotent: re-provisioning resets the balance to the plan''s allowance and

        updates the renewal date.'
      operationId: provision_enterprise
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/EnterpriseProvisionRequest'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterpriseProvisionResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
  /api/organizations/{org_id}/downgrade:
    post:
      tags:
      - organizations
      summary: Downgrade an organization from the Enterprise plan to the default Free plan
      description: 'Downgrade an organization from Enterprise to the default Free plan.


        Superuser-only. Moves the org plan to Free, cancels the enterprise

        subscription, and writes a ledger entry. CIU balance is left unchanged.'
      operationId: downgrade_enterprise
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/EnterpriseDowngradeRequest'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterpriseDowngradeResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
  /api/organizations/{org_id}/grant-credits:
    post:
      tags:
      - organizations
      summary: Manually grant CIU credits to an organization
      description: 'Add CIU credits to an organization''s balance.


        Superuser-only. Increases total_cius by the given amount and creates

        a CREDIT ledger entry with MANUAL_ADJUSTMENT action type for audit trail.'
      operationId: grant_ciu_credits
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      requestBody:
        required: true
