openapi: 3.2.0
info:
  title: Crowdbotics API Documentation Organizations API
  description: '# CoreStory API Overview


    The CoreStory API provides programmatic access to structured insights derived from software source code.'
  version: 1.26.2
servers:
- url: /
  description: Current server
security:
- BearerAuth: []
tags:
- name: Organizations
paths:
  /api/organizations/schedule:
    get:
      tags:
      - Organizations
      summary: Get the org update schedule
      description: Return the org update schedule, or null if none exists.
      operationId: get_update_schedule
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/UpdateScheduleResponse'
                - type: 'null'
                title: Response Get Update Schedule
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
    put:
      tags:
      - Organizations
      summary: Create or update the org update schedule
      description: Create or update the org update schedule. Blocked while a run is in progress.
      operationId: upsert_update_schedule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduleUpsert'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateScheduleResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
  /api/organizations/projects/sync-status:
    get:
      tags:
      - Organizations
      summary: List org projects with sync status
      description: Return a paginated list of projects in the org with their sync mode and status.
      operationId: list_project_sync_status
      parameters:
      - name: sync_mode
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/SyncMode'
          - type: 'null'
          description: Filter by sync mode
          title: Sync Mode
        description: Filter by sync mode
      - name: sort_by
        in: query
        required: false
        schema:
          enum:
          - name
          - last_ingested_at
          type: string
          description: Sort field
          default: name
          title: Sort By
        description: Sort field
      - name: sort_order
        in: query
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
          description: Sort direction
          default: asc
          title: Sort Order
        description: Sort direction
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-based)
          default: 1
          title: Page
        description: Page number (1-based)
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Items per page
          default: 50
          title: Size
        description: Items per page
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatusResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
  /api/organizations/pinned-workspaces:
    get:
      tags:
      - Organizations
      summary: List the org's pinned workspaces
      description: Return pinned workspaces in pin order. Any org member may read; empty list if none.
      operationId: list_pinned_workspaces
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PinnedWorkspaceItem'
                type: array
                title: Response List Pinned Workspaces
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
    post:
      tags:
      - Organizations
      summary: Pin a workspace (admin only)
      description: 'Pin a workspace for the org. Admin only. Enforces the per-org pin cap.


        Returns the created pin with its derived sync status so the client can render

        it without a follow-up list call.'
      operationId: pin_workspace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinWorkspaceRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinnedWorkspaceItem'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
  /api/organizations/pinned-workspaces/{project_id}:
    delete:
      tags:
      - Organizations
      summary: Unpin a workspace (admin only)
      description: Remove a workspace pin. Admin only. 404 if the workspace wasn't pinned.
      operationId: unpin_workspace
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      responses:
        '204':
          description: Successful Response
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
  /api/organizations/ingestion-config:
    get:
      tags:
      - Organizations
      summary: Get ingestion configuration
      description: Get the ingestion file type configuration for the current organization. Returns custom config if set, otherwise returns global defaults.
      operationId: get_ingestion_config
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionConfigResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
    put:
      tags:
      - Organizations
      summary: Update ingestion configuration
      description: Update the ingestion file type configuration for the current organization. Requires admin role. Provide supported_extensions and/or binary_extensions to override defaults.
      operationId: update_ingestion_config
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestionConfigUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionConfigResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
    delete:
      tags:
      - Organizations
      summary: Reset ingestion configuration
      description: Reset ingestion configuration to global defaults. Requires admin role.
      operationId: reset_ingestion_config
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionConfigResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
    patch:
      tags:
      - Organizations
      summary: Add extensions to ingestion configuration
      description: Additively merge extensions into the current ingestion configuration. Provided extensions are added to the existing set (defaults or custom). Requires admin role.
      operationId: patch_ingestion_config
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestionConfigPatch'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionConfigResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
  /api/organizations/my:
    get:
      tags:
      - Organizations
      summary: List my organizations
      description: List organizations the current user belongs to
      operationId: list_my_organizations_api_organizations_my_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OrganizationResponse'
                type: array
                title: Response List My Organizations Api Organizations My Get
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
  /api/organizations/{org_id}:
    get:
      tags:
      - Organizations
      summary: Get organization
      description: Get organization details by ID
      operationId: get_organization_api_organizations__org_id__get
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Org Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
    patch:
      tags:
      - Organizations
      summary: Update organization
      description: Update organization details (requires admin role)
      operationId: update_organization_api_organizations__org_id__patch
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Org Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
    delete:
      tags:
      - Organizations
      summary: Delete organization
      description: Delete an organization (requires owner role)
      operationId: delete_organization_api_organizations__org_id__delete
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Org Id
      responses:
        '204':
          description: Successful Response
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
  /api/organizations/{org_id}/members:
    get:
      tags:
      - Organizations
      summary: Get organization with members
      description: Get organization details including all members
      operationId: get_organization_with_members_api_organizations__org_id__members_get
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Org Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationWithMembers'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
    post:
      tags:
      - Organizations
      summary: Add member to organization
      description: Add a new member to the organization (requires admin role)
      operationId: add_member_api_organizations__org_id__members_post
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Org Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMembershipResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
  /api/organizations/invitations:
    post:
      tags:
      - Organizations
      summary: Invite member to organization
      description: Send an organization invitation email via Clerk (requires admin role). The target organization is resolved from the caller's active org context (JWT). Supports a redirect_url so the invitee lands on a specific page after accepting.
      operationId: invite_member
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationInvitationResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
  /api/organizations/{org_id}/members/{user_id}:
    patch:
      tags:
      - Organizations
      summary: Update member role
      description: Update a member's role in the organization (requires admin role)
      operationId: update_member_role_api_organizations__org_id__members__user_id__patch
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Org Id
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRoleRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMembershipResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
    delete:
      tags:
      - Organizations
      summary: Remove member from organization
      description: Remove a member from the organization (requires admin role)
      operationId: remove_member_api_organizations__org_id__members__user_id__delete
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Org Id
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      responses:
        '204':
          description: Successful Response
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
  /api/organizations/{org_id}/set-personal:
    post:
      tags:
      - Organizations
      summary: Mark organization as personal
      description: 'Set is_personal: true in the organization''s Clerk public metadata.'
      operationId: set_organization_personal
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Org Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetPersonalResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
  /api/organizations/sync:
    post:
      tags:
      - Organizations
      summary: Sync organization from Clerk
      description: Sync organization and members from Clerk
      operationId: sync_from_clerk_api_organizations_sync_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncFromClerkRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncFromClerkResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
  /api/organizations/{org_id}/provision-enterprise:
    post:
      tags:
      - Organizations
      summary: Provision an organization onto a sales-managed plan (Business or Enterprise)
      description: 'Manually provision an organization onto a sales-managed plan.


        Superuser-only. Provisions the org onto the plan given by ``plan_slug``

        (Business or any Enterprise variant; defaults to the largest Enterprise

        bracket), allocating that plan''s CIU allowance, writing a ledger entry, and

        syncing the plan family to Clerk metadata.


        Idempotent: re-provisioning resets the balance to the plan''s allowance and

        updates the renewal date.'
      operationId: provision_enterprise
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/EnterpriseProvisionRequest'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterpriseProvisionResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
  /api/organizations/{org_id}/downgrade:
    post:
      tags:
      - Organizations
      summary: Downgrade an organization from the Enterprise plan to the default Free plan
      description: 'Downgrade an organization from Enterprise to the default Free plan.


        Superuser-only. Moves the org plan to Free, cancels the enterprise

        subscription, and writes a ledger entry. CIU balance is left unchanged.'
      operationId: downgrade_enterprise
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/EnterpriseDowngradeRequest'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterpriseDowngradeResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
  /api/organizations/{org_id}/grant-credits:
    post:
      tags:
      - Organizations
      summary: Manually grant CIU credits to an organization
      description: 'Add CIU credits to an organization''s balance.


        Superuser-only. Increases total_cius by the given amount and creates

        a CREDIT ledger entry with MANUAL_ADJUSTMENT action type for audit trail.'
      operationId: grant_ciu_credits
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantCreditsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantCreditsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: Not found
components:
  schemas:
    GrantCreditsRequest:
      properties:
        amount:
          type: integer
          exclusiveMinimum: 0.0
          title: Amount
          description: Number of CIU credits to grant (must be a whole number)
        reason:
          type: string
          maxLength: 500
          minLength: 1
          title: Reason
          description: Reason for granting credits (required)
      type: object
      required:
      - amount
      - reason
      title: GrantCreditsRequest
      description: Request schema for manually granting CIU credits to an organization.
    SyncStatusItem:
      properties:
        project_id:
          type: integer
          title: Project Id
          description: Project ID
        name:
          type: string
          title: Name
          description: Project name
        sync_mode:
          $ref: '#/components/schemas/SyncMode'
          description: Manual or Auto
        status:
          $ref: '#/components/schemas/ProjectSyncStatus'
          description: Current sync/processing status
        last_ingested_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Ingested At
          description: Last successful ingestion timestamp
      type: object
      required:
      - project_id
      - name
      - sync_mode
      - status
      title: SyncStatusItem
      description: A single project row in the org project sync-status list.
    SyncFromClerkResponse:
      properties:
        organization:
          $ref: '#/components/schemas/OrganizationResponse'
        members_synced:
          type: integer
          title: Members Synced
          default: 0
        members_failed:
          type: integer
          title: Members Failed
          default: 0
        message:
          type: string
          title: Message
      type: object
      required:
      - organization
      - message
      title: SyncFromClerkResponse
      description: Response from Clerk sync operation.
    PinnedWorkspaceItem:
      properties:
        project_id:
          type: integer
          title: Project Id
          description: Workspace (project) ID.
        name:
          type: string
          title: Name
          description: Workspace name.
        repo_slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Repo Slug
          description: Repository slug in 'owner/repo' form, if known.
        status:
          $ref: '#/components/schemas/ProjectSyncStatus'
          description: Current ingestion/sync status of the workspace.
        pinned_at:
          type: string
          format: date-time
          title: Pinned At
          description: When the workspace was pinned (drives pin order).
        is_stale:
          type: boolean
          title: Is Stale
          description: Whether the workspace intelligence is out of sync with the repo.
          default: false
        last_ingested_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Ingested At
          description: Timestamp of the last successful ingestion.
        ingestion_status:
          $ref: '#/components/schemas/JobStatus'
          description: Status of the workspace's latest ingestion job.
          default: not_started
      type: object
      required:
      - project_id
      - name
      - status
      - pinned_at
      title: PinnedWorkspaceItem
      description: A single pinned workspace, annotated with workspace metadata for display.
    PinWorkspaceRequest:
      properties:
        project_id:
          type: integer
          title: Project Id
          description: ID of the workspace (project) to pin.
      type: object
      required:
      - project_id
      title: PinWorkspaceRequest
      description: Body for pinning a workspace.
    SyncFromClerkRequest:
      properties:
        clerk_org_id:
          type: string
          title: Clerk Org Id
          description: Clerk organization ID to sync
        sync_members:
          type: boolean
          title: Sync Members
          description: Whether to sync members
          default: true
      type: object
      required:
      - clerk_org_id
      title: SyncFromClerkRequest
      description: Request to sync organization from Clerk.
    ProjectSyncStatus:
      type: string
      enum:
      - up_to_date
      - updating
      - stale
      - failed
      - couldnt_process
      title: ProjectSyncStatus
      description: Sync/processing status for a project in the org roster.
    EnterpriseDowngradeResponse:
      properties:
        organization_id:
          type: string
          title: Organization Id
          description: Organization database ID
        clerk_org_id:
          type: string
          title: Clerk Org Id
          description: Clerk organization ID
        plan:
          type: string
          title: Plan
          description: Resulting plan tier name
        downgraded_at:
          type: string
          format: date-time
          title: Downgraded At
          description: When the downgrade occurred
      type: object
      required:
      - organization_id
      - clerk_org_id
      - plan
      - downgraded_at
      title: EnterpriseDowngradeResponse
      description: Response after successfully downgrading an org from the Enterprise plan.
    ScheduleCadence:
      type: string
      enum:
      - daily
      - weekly
      - monthly
      title: ScheduleCadence
      description: How frequently the org schedule runs.
    UpdateScheduleUpsert:
      properties:
        cadence:
          $ref: '#/components/schemas/ScheduleCadence'
        day_of_week:
          anyOf:
          - type: integer
            maximum: 6.0
            minimum: 0.0
          - type: 'null'
          title: Day Of Week
          description: 0=Monday..6=Sunday. Required when weekly.
        day_of_month:
          anyOf:
          - type: integer
            maximum: 28.0
            minimum: 1.0
          - type: 'null'
          title: Day Of Month
          description: 1-28. Required when monthly.
        time:
          type: string
          pattern: ^([01]\d|2[0-3]):(00|30)$
          title: Time
          description: HH:MM in 24h format. Must be on a 30-minute boundary (e.g. 09:00, 09:30).
        doc_sync:
          type: boolean
          title: Doc Sync
          default: true
      type: object
      required:
      - cadence
      - time
      title: UpdateScheduleUpsert
      description: Create or update an org update schedule. Single atomic operation.
