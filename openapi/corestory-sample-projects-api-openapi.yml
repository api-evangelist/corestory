openapi: 3.2.0
info:
  title: Crowdbotics API Documentation Sample Projects API
  description: '# CoreStory API Overview


    The CoreStory API provides programmatic access to structured insights derived from software source code.'
  version: 1.26.2
servers:
- url: /
  description: Current server
security:
- BearerAuth: []
tags:
- name: sample_projects
paths:
  /api/projects/samples:
    get:
      tags:
      - sample_projects
      summary: List sample projects
      description: List all available sample projects with pagination. Requires CoreStory internal access.
      operationId: list_sample_projects
      parameters:
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SampleProjectDetail'
                title: Response List Sample Projects
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
    post:
      tags:
      - sample_projects
      summary: Create sample project
      description: Create a new sample project from an existing project. Requires CoreStory internal access.
      operationId: create_sample_project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SampleProjectCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SampleProjectDetail'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
  /api/projects/samples/{sample_project_id}:
    get:
      tags:
      - sample_projects
      summary: Get sample project
      description: Retrieve details for a specific sample project by ID. Requires CoreStory internal access.
      operationId: get_sample_project
      parameters:
      - name: sample_project_id
        in: path
        required: true
        schema:
          type: integer
          title: Sample Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SampleProjectDetail'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
    patch:
      tags:
      - sample_projects
      summary: Update sample project
      description: Update an existing sample project's details. Requires CoreStory internal access.
      operationId: update_sample_project
      parameters:
      - name: sample_project_id
        in: path
        required: true
        schema:
          type: integer
          title: Sample Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SampleProjectUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SampleProjectDetail'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
    delete:
      tags:
      - sample_projects
      summary: Delete sample project
      description: Delete a sample project entry. Requires CoreStory internal access.
      operationId: delete_sample_project
      parameters:
      - name: sample_project_id
        in: path
        required: true
        schema:
          type: integer
          title: Sample Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicSuccessResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
  /api/projects/samples/clone:
    post:
      tags:
      - sample_projects
      summary: Clone a sample project
      description: Clone a sample project by language into the current user's organization. Creates a new project with all related data.
      operationId: clone_sample_project
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_clone_sample_project'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClonedSampleProjectResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
components:
  schemas:
    ErrorSchema:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      type: object
      required:
      - error
      title: ErrorSchema
    Body_clone_sample_project:
      properties:
        language:
          type: string
          maxLength: 64
          minLength: 1
          title: Language
      type: object
      required:
      - language
      title: Body_clone_sample_project
    ClonedSampleProjectResponse:
      properties:
        new_project_id:
          type: integer
          title: New Project Id
      type: object
      required:
      - new_project_id
      title: ClonedSampleProjectResponse
    SampleProjectCreate:
      properties:
        language:
          type: string
          maxLength: 64
          minLength: 1
          title: Language
        project_id:
          type: integer
          title: Project Id
      type: object
      required:
      - language
      - project_id
      title: SampleProjectCreate
    SampleProjectUpdate:
      properties:
        language:
          anyOf:
          - type: string
            maxLength: 64
            minLength: 1
          - type: 'null'
          title: Language
        project_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Project Id
      type: object
      title: SampleProjectUpdate
    SampleProjectDetail:
      properties:
        language:
          type: string
          maxLength: 64
          minLength: 1
          title: Language
        project_id:
          type: integer
          title: Project Id
        id:
          type: integer
          title: Id
      type: object
      required:
      - language
      - project_id
      - id
      title: SampleProjectDetail
    ErrorBody:
      properties:
        message:
          type: string
          title: Message
        type:
          type: string
          title: Type
        details:
          additionalProperties: true
          type: object
          title: Details
          description: Optional extra context for the error.
      type: object
      required:
      - message
      - type
      title: ErrorBody
    BasicSuccessResponse:
      properties:
        detail:
          type: string
          title: Detail
          default: success
      type: object
      title: BasicSuccessResponse
      description: 'Use this for returns for deletes and patches.

        UI ALWAYS needs some payload return. This just standarizes it.'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter the Bearer token from Clerk authentication
