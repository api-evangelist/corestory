openapi: 3.2.0
info:
  title: Crowdbotics API Documentation Mermaid API
  description: '# CoreStory API Overview


    The CoreStory API provides programmatic access to structured insights derived from software source code.'
  version: 1.26.2
servers:
- url: /
  description: Current server
security:
- BearerAuth: []
tags:
- name: mermaid
paths:
  /api/mermaid/fix:
    post:
      tags:
      - mermaid
      summary: Fix broken Mermaid diagram using AI
      description: 'Fix broken Mermaid diagram syntax using an LLM.


        Takes broken Mermaid code and the rendering error, sends it to an LLM

        for syntax correction, and returns the fixed code.'
      operationId: fix_mermaid_diagram
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MermaidFixRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MermaidFixResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
components:
  schemas:
    ErrorBody:
      properties:
        message:
          type: string
          title: Message
        type:
          type: string
          title: Type
        details:
          additionalProperties: true
          type: object
          title: Details
          description: Optional extra context for the error.
      type: object
      required:
      - message
      - type
      title: ErrorBody
    ErrorSchema:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      type: object
      required:
      - error
      title: ErrorSchema
    MermaidFixResponse:
      properties:
        code:
          type: string
          title: Code
          description: The corrected Mermaid diagram code
      type: object
      required:
      - code
      title: MermaidFixResponse
    MermaidFixRequest:
      properties:
        code:
          type: string
          minLength: 1
          title: Code
          description: The broken Mermaid diagram code
          examples:
          - "graph TD\n  A[Start --> B[End]"
        error:
          type: string
          minLength: 1
          title: Error
          description: The client-side rendering error message
          examples:
          - 'Parse error on line 2: missing closing bracket'
      type: object
      required:
      - code
      - error
      title: MermaidFixRequest
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter the Bearer token from Clerk authentication
