openapi: 3.2.0
info:
  title: Crowdbotics API Documentation OAUTH Discovery API
  description: '# CoreStory API Overview


    The CoreStory API provides programmatic access to structured insights derived from software source code.'
  version: 1.26.2
servers:
- url: /
  description: Current server
security:
- BearerAuth: []
tags:
- name: OAuth Discovery
paths:
  /.well-known/oauth-protected-resource:
    get:
      tags:
      - OAuth Discovery
      summary: Protected Resource Metadata (RFC 9728)
      description: Advertise the MCP endpoint and point clients at Clerk as the AS.
      operationId: get_protected_resource_metadata
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectedResourceMetadata'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
components:
  schemas:
    ErrorBody:
      properties:
        message:
          type: string
          title: Message
        type:
          type: string
          title: Type
        details:
          additionalProperties: true
          type: object
          title: Details
          description: Optional extra context for the error.
      type: object
      required:
      - message
      - type
      title: ErrorBody
    ErrorSchema:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      type: object
      required:
      - error
      title: ErrorSchema
    ProtectedResourceMetadata:
      properties:
        resource:
          type: string
          title: Resource
        authorization_servers:
          items:
            type: string
          type: array
          title: Authorization Servers
        bearer_methods_supported:
          items:
            type: string
          type: array
          title: Bearer Methods Supported
          default:
          - header
        scopes_supported:
          items:
            type: string
          type: array
          title: Scopes Supported
          default:
          - profile
          - email
      type: object
      required:
      - resource
      - authorization_servers
      title: ProtectedResourceMetadata
      description: 'RFC 9728 Protected Resource Metadata.


        Hand-rolled (rather than importing ``mcp.shared.auth``) so the Resource

        Server has no dependency on the MCP SDK package.'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter the Bearer token from Clerk authentication
